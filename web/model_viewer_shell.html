<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Granit WebGPU Model Viewer</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #17263b; }
      body { color: #e5e7eb; font-family: system-ui, sans-serif; }
      main { width: 100%; height: 100%; position: relative; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      output {
        box-sizing: border-box; position: absolute; left: 50%; top: 50%;
        width: min(420px, calc(100% - 32px)); min-height: 118px;
        transform: translate(-50%, -50%); overflow: hidden;
        border: 1px solid #525866; border-radius: 4px;
        background: #24272e; box-shadow: 0 12px 32px rgb(0 0 0 / 36%);
      }
      output[data-status="ready"] { display: none; }
      .loading-title {
        display: block; padding: 6px 10px; color: #f3f4f6; background: #343841;
        border-bottom: 1px solid #16181d; font-size: 13px; font-weight: 500;
      }
      .loading-content { display: block; padding: 10px; }
      #status-text { display: block; min-height: 20px; font-size: 13px; }
      progress {
        width: 100%; height: 18px; margin: 3px 0 7px; display: block;
        border: 0; border-radius: 2px; overflow: hidden; background: #17191e;
        accent-color: #6789ad;
      }
      progress::-webkit-progress-bar { background: #17191e; }
      progress::-webkit-progress-value { background: #6789ad; }
      progress::-moz-progress-bar { background: #6789ad; }
      .loading-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .loading-hint { color: #9298a5; font-size: 12px; line-height: 1.25; }
      #cancel-loading {
        flex: none; color: #e5e7eb; background: #343841; border: 1px solid #59606d;
        border-radius: 3px; padding: 4px 12px; cursor: pointer;
      }
      #cancel-loading:hover { background: #414650; border-color: #6d7584; }
      aside {
        position: absolute; top: 16px; right: 16px; width: 220px; padding: 14px;
        border: 1px solid rgb(148 163 184 / 28%); border-radius: 9px;
        background: rgb(15 23 42 / 88%); box-shadow: 0 12px 30px rgb(0 0 0 / 24%);
      }
      aside h1 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
      label { display: flex; align-items: center; justify-content: space-between; margin: 9px 0; }
      select, input { accent-color: #8878f2; }
      small { display: block; margin-top: 10px; color: #94a3b8; line-height: 1.4; }
      aside[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <canvas id="canvas" width="1280" height="720" tabindex="0"></canvas>
      <output id="granit-status" data-status="starting">
        <span class="loading-title">Loading Model</span>
        <span class="loading-content">
          <span id="status-text">Initializing WebGPU renderer…</span>
          <progress id="loading-progress" max="1" value="0"></progress>
          <span class="loading-footer">
            <span class="loading-hint">The viewer remains responsive while resources are loaded.</span>
            <button id="cancel-loading" type="button">Cancel</button>
          </span>
        </span>
      </output>
      <aside id="quality-panel" hidden>
        <h1>Render Quality</h1>
        <label>MSAA <select id="msaa"><option value="1">Off</option><option value="4">4×</option></select></label>
        <label>FXAA <input id="fxaa" type="checkbox" checked /></label>
        <label>Specular AA <input id="specular-aa" type="checkbox" checked /></label>
        <label>Anisotropy <select id="anisotropy"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select></label>
        <small>Drag to orbit · Wheel to zoom</small>
      </aside>
    </main>
    <script>
      const canvas = document.getElementById("canvas");
      const statusElement = document.getElementById("granit-status");
      const statusText = document.getElementById("status-text");
      const loadingProgress = document.getElementById("loading-progress");
      const qualityPanel = document.getElementById("quality-panel");
      function resizeCanvas() {
        const ratio = Math.max(1, window.devicePixelRatio || 1);
        canvas.width = Math.max(1, Math.round(canvas.clientWidth * ratio));
        canvas.height = Math.max(1, Math.round(canvas.clientHeight * ratio));
      }
      function updateStatus(text) {
        if (!text.startsWith("GRANIT_STATUS:")) return;
        const status = text.slice("GRANIT_STATUS:".length);
        statusElement.dataset.status = status.startsWith("failed:") ? "failed" : status;
        statusText.textContent = status;
        if (status === "ready") {
          qualityPanel.hidden = false;
          const maximum = Module._granit_web_max_sampler_anisotropy();
          for (const option of document.getElementById("anisotropy").options)
            option.disabled = Number(option.value) > maximum;
        }
      }
      function updateProgress(text) {
        if (!text.startsWith("GRANIT_PROGRESS:")) return;
        const [, stage, completedText, totalText] = text.split(":");
        const completed = Number(completedText);
        const total = Number(totalText);
        loadingProgress.max = Math.max(1, total);
        loadingProgress.value = Math.min(completed, loadingProgress.max);
        statusText.textContent = `Loading ${stage}… ${completed}/${total}`;
      }
      document.getElementById("cancel-loading").addEventListener("click", () => {
        if (typeof Module._granit_web_cancel_loading === "function")
          Module._granit_web_cancel_loading();
      });
      function applyQuality() {
        const result = Module._granit_web_configure_render_quality(
          Number(document.getElementById("msaa").value),
          Number(document.getElementById("fxaa").checked),
          Number(document.getElementById("specular-aa").checked),
          Number(document.getElementById("anisotropy").value));
        if (result !== 0) console.error(`Render quality update failed: ${result}`);
      }
      qualityPanel.addEventListener("change", applyQuality);
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
      var Module = {
        canvas,
        onRuntimeInitialized() { Module.runtimeReady = true; },
        print(text) { console.log(text); updateStatus(text); updateProgress(text); },
        printErr(text) { console.error(text); updateStatus(text); updateProgress(text); },
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
