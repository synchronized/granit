<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Granit SDL3 + ImGui | WebGPU</title>
    <style>
      html, body, main { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #0e1119; color: #e5e7eb; font-family: system-ui, sans-serif; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
      output { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
      output[data-status="ready"] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <canvas id="canvas" width="1280" height="720" tabindex="0"></canvas>
      <output id="granit-status" data-status="starting">Initializing SDL3 and WebGPU…</output>
    </main>
    <script>
      const canvas = document.getElementById("canvas");
      const statusElement = document.getElementById("granit-status");
      function resizeCanvas() {
        const ratio = Math.max(1, window.devicePixelRatio || 1);
        canvas.width = Math.max(1, Math.round(canvas.clientWidth * ratio));
        canvas.height = Math.max(1, Math.round(canvas.clientHeight * ratio));
      }
      function updateStatus(text) {
        if (!text.startsWith("GRANIT_STATUS:")) return;
        const status = text.slice("GRANIT_STATUS:".length);
        statusElement.dataset.status = status.startsWith("failed:") ? "failed" : status;
        statusElement.textContent = status;
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
      var Module = {
        canvas,
        onRuntimeInitialized() { Module.runtimeReady = true; },
        print(text) { console.log(text); updateStatus(text); },
        printErr(text) { console.error(text); updateStatus(text); },
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
