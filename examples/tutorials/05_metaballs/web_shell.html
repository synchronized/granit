<head>

  <title>Granit Tutorial 05: Metaballs</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #070912; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <script>
    var Module = {
      canvas: document.getElementById("canvas"),
      onRuntimeInitialized() { Module.runtimeReady = true; },
      print(text) { console.log(text); },
      printErr(text) { console.error(text); },
    };
  </script>

</body>
