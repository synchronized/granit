<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Granit WebGPU Model Viewer</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #17263b; }
      main { width: 100%; height: 100%; position: relative; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }
    </style>
  </head>
  <body>
    <main>
      <canvas id="canvas" width="1280" height="720" tabindex="0"></canvas>
      <output id="granit-status" hidden data-status="starting" data-stage="bootstrap"
              data-result="0" data-progress-stages=""></output>
    </main>
    <script>
      const canvas = document.getElementById("canvas");
      const statusElement = document.getElementById("granit-status");
      function resizeCanvas() {
        const ratio = Math.max(1, window.devicePixelRatio || 1);
        canvas.width = Math.max(1, Math.round(canvas.clientWidth * ratio));
        canvas.height = Math.max(1, Math.round(canvas.clientHeight * ratio));
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
      var Module = {
        canvas,
        onRuntimeInitialized() { Module.runtimeReady = true; },
        onGranitStatus(status, stage, result) {
          statusElement.dataset.status = status;
          statusElement.dataset.stage = stage;
          statusElement.dataset.result = String(result);
          statusElement.textContent = status === "failed" ? `${status}:${stage}:${result}` : status;
        },
        onGranitProgress(stage, completed, total) {
          const stages = new Set(statusElement.dataset.progressStages.split(",").filter(Boolean));
          stages.add(stage);
          statusElement.dataset.progressStages = [...stages].join(",");
          globalThis.granitProgressHook?.(stage, completed, total);
        },
        print(text) { console.log(text); },
        printErr(text) { console.error(text); },
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
