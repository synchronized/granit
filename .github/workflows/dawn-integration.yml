name: Dawn Integration

on:
  workflow_call:
    inputs:
      run_windows:
        required: true
        type: boolean
      run_linux:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      run_windows:
        description: "使用预编译 SDK 验证 Windows WebGPU 插件"
        required: true
        default: true
        type: boolean
      run_linux:
        description: "使用预编译 SDK 验证 Linux WebGPU 插件"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  DAWN_REVISION: 0bc38adde72b79013536f8ce354b639ae19ae195
  DAWN_VERSION: v20260720.160313
  DAWN_SDK_TAG: dawn-sdk-v20260720.160313-0bc38adde72b

jobs:
  model-viewer-reference:
    if: ${{ inputs.run_windows || inputs.run_linux }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: 安装 Vulkan 参考渲染依赖
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang libvulkan-dev mesa-vulkan-drivers ninja-build vulkan-validationlayers
      - name: 构建模型查看器离屏验收程序
        shell: bash
        run: |
          build="$RUNNER_TEMP/granit-model-viewer-reference"
          CC=clang CXX=clang++ cmake -S . -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGRANIT_BUILD_MODEL_VIEWER_EXAMPLE=ON \
            -DGRANIT_FETCH_EXAMPLE_GLTF_DEPENDENCIES=ON \
            -DGRANIT_BUILD_TESTING=OFF \
            -DGRANIT_ENABLE_XCB=OFF \
            -DGRANIT_ENABLE_WAYLAND=OFF
          cmake --build "$build" --target granit_model_viewer_offscreen_acceptance
      - name: 生成 FlightHelmet Vulkan 参考图
        shell: bash
        run: |
          build="$RUNNER_TEMP/granit-model-viewer-reference"
          assets="$RUNNER_TEMP/granit-flight-helmet"
          output="$RUNNER_TEMP/model-viewer-reference"
          cmake -DGRANIT_SOURCE_DIR="$PWD" \
            -DGRANIT_FLIGHT_HELMET_OUTPUT_DIR="$assets" \
            -P cmake/fetch_flight_helmet.cmake
          mkdir -p "$output"
          lvp_icd="$(find /usr/share/vulkan/icd.d -type f -name 'lvp_icd*.json' -print -quit)"
          [[ -n "$lvp_icd" ]]
          VK_DRIVER_FILES="$lvp_icd" LIBGL_ALWAYS_SOFTWARE=1 \
            "$build/bin/granit_model_viewer_offscreen_acceptance" \
              --asset "$assets/glTF/FlightHelmet.gltf" \
              --output "$output/flight-helmet-vulkan.rgba" \
              --backend=vulkan --validation 2>&1 | tee "$output/reference.log"
          cp examples/assets/FlightHelmet.manifest.json "$output/"
          sha256sum "$output/flight-helmet-vulkan.rgba" > "$output/flight-helmet-vulkan.sha256"
      - name: 上传 FlightHelmet Vulkan 参考图
        uses: actions/upload-artifact@v6
        with:
          name: s13-model-viewer-reference
          path: ${{ runner.temp }}/model-viewer-reference
          if-no-files-found: error
          retention-days: 3

  windows:
    if: ${{ inputs.run_windows }}
    needs: model-viewer-reference
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-msvc
        with:
          arch: x64
      - name: 下载并校验 Windows Dawn SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "granit-dawn-static-$env:DAWN_VERSION-windows-x64"
          gh release download $env:DAWN_SDK_TAG --repo $env:GITHUB_REPOSITORY `
            --pattern "$name.zip" --pattern "$name.zip.sha256"
          $expected = (Get-Content "$name.zip.sha256").Split(' ')[0].Trim()
          $actual = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Windows Dawn SDK SHA-256 不匹配" }
          Expand-Archive -LiteralPath "$name.zip" -DestinationPath stage
      - name: 下载 FlightHelmet Vulkan 参考图
        uses: actions/download-artifact@v6
        with:
          name: s13-model-viewer-reference
          path: ${{ runner.temp }}/model-viewer-reference
      - name: 构建并运行 Windows WebGPU 集成测试
        id: integration
        shell: pwsh
        run: |
          $stage = "$PWD/stage/granit-dawn-static-$env:DAWN_VERSION-windows-x64"
          $build = "$env:RUNNER_TEMP/granit-webgpu-build"
          $vertexAsset = "$env:RUNNER_TEMP/s10c_tool_triangle.vert.granit-shader"
          $fragmentAsset = "$env:RUNNER_TEMP/s10c_tool_triangle.frag.granit-shader"
          cmake -S . -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DGRANIT_BUILD_BACKEND_WEBGPU=ON `
            -DGRANIT_WEBGPU_FORCE_FALLBACK_ADAPTER=ON `
            "-DGRANIT_DAWN_ROOT=$stage" `
            "-DGRANIT_S10C_VERTEX_SHADER_ASSET=$vertexAsset" `
            "-DGRANIT_S10C_FRAGMENT_SHADER_ASSET=$fragmentAsset" `
            -DGRANIT_BUILD_EXAMPLES=ON `
            -DGRANIT_BUILD_MODEL_VIEWER_EXAMPLE=ON `
            -DGRANIT_FETCH_EXAMPLE_GLTF_DEPENDENCIES=ON `
            -DGRANIT_BUILD_INTEGRATION_SDL3=ON `
            -DGRANIT_BUILD_INTEGRATION_IMGUI=ON `
            -DGRANIT_FETCH_INTEGRATION_DEPENDENCIES=ON `
            -DGRANIT_BUILD_TOOLS=ON `
            -DGRANIT_BUILD_TESTING=ON
          cmake --build $build --target granit_webgpu_plugin_smoke `
            granit_renderer_test granit_shader_tool granit_model_viewer_offscreen_acceptance `
            granit_model_viewer_example
          $shaderTool = "$build/bin/granit_shader_tool.exe"
          & $shaderTool compile --tint "$stage/bin/tint.exe" `
            --input "$PWD/tests/fixtures/shaders/s10c_triangle.wgsl" --entry vs_main `
            --stage vertex --output "$env:RUNNER_TEMP/s10c_tool_triangle.vert.spv" `
            --asset $vertexAsset --tint-revision "$env:DAWN_REVISION"
          if ($LASTEXITCODE -ne 0) { throw "Vertex Shader 资产构建失败" }
          & $shaderTool compile --tint "$stage/bin/tint.exe" `
            --input "$PWD/tests/fixtures/shaders/s10c_triangle.wgsl" --entry fs_main `
            --stage fragment --output "$env:RUNNER_TEMP/s10c_tool_triangle.frag.spv" `
            --asset $fragmentAsset --tint-revision "$env:DAWN_REVISION"
          if ($LASTEXITCODE -ne 0) { throw "Fragment Shader 资产构建失败" }
          $fxc = "$env:WINDIR/System32/d3dcompiler_47.dll"
          if (-not (Test-Path -LiteralPath $fxc -PathType Leaf)) {
            throw "Windows runner 缺少 d3dcompiler_47.dll"
          }
          Copy-Item -LiteralPath $fxc -Destination "$build/bin/d3dcompiler_47.dll"
          ctest --test-dir $build -R granit.backend.webgpu_plugin_smoke `
            --verbose --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Windows WebGPU 插件 smoke test 失败" }
          & "$build/bin/granit_renderer_test.exe" "[pipeline][bind-group][smoke]"
          if ($LASTEXITCODE -ne 0) { throw "Windows 跨后端 Renderer Fixture 失败" }
      - name: 验证 Windows Dawn FlightHelmet 截图
        shell: pwsh
        run: |
          $build = "$env:RUNNER_TEMP/granit-webgpu-build"
          $assets = "$env:RUNNER_TEMP/granit-flight-helmet"
          $output = "$build/test-artifacts/s13-model-viewer"
          cmake "-DGRANIT_SOURCE_DIR=$PWD" `
            "-DGRANIT_FLIGHT_HELMET_OUTPUT_DIR=$assets" `
            -P cmake/fetch_flight_helmet.cmake
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Copy-Item examples/assets/FlightHelmet.manifest.json $output
          & "$build/bin/granit_model_viewer_offscreen_acceptance.exe" `
            --asset "$assets/glTF/FlightHelmet.gltf" `
            --output "$output/flight-helmet-windows-webgpu.rgba" `
            --expected "$env:RUNNER_TEMP/model-viewer-reference/flight-helmet-vulkan.rgba" `
            --backend=webgpu `
            --backend-library "$build/lib/granit_backend_webgpu.dll" `
            --validation 2>&1 | Tee-Object "$output/acceptance.log"
          if ($LASTEXITCODE -ne 0) { throw "Windows Dawn FlightHelmet 截图验收失败" }
      - name: 采集 Windows Dawn 模型查看器性能
        if: ${{ always() && steps.integration.outcome == 'success' }}
        shell: pwsh
        run: |
          $build = "$env:RUNNER_TEMP/granit-webgpu-build"
          $assets = "$env:RUNNER_TEMP/granit-flight-helmet"
          $output = "$build/test-artifacts/s13-model-viewer/performance"
          $executable = "$build/bin/granit_model_viewer_example.exe"
          $plugin = "$build/lib/granit_backend_webgpu.dll"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          "| 平台 | 呈现模式 | UI | CPU p50 (ms) | CPU p95 (ms) | GPU p50 (ms) |" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "| --- | --- | --- | ---: | ---: | ---: |" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          foreach ($mode in @("fifo", "immediate")) {
            foreach ($ui in @("no-ui", "ui")) {
              $report = "$output/windows-webgpu-$mode-$ui.json"
              $log = "$output/windows-webgpu-$mode-$ui.log"
              $arguments = @(
                "--asset", "$assets/glTF/FlightHelmet.gltf",
                "--backend=webgpu", "--backend-library", $plugin,
                "--present-mode=$mode", "--profile-output", $report
              )
              if ($ui -eq "no-ui") { $arguments += "--no-ui" }
              & $executable @arguments 2>&1 | Tee-Object -FilePath $log
              if ($LASTEXITCODE -ne 0) {
                $unsupported = Select-String -LiteralPath $log -SimpleMatch "unsupported operation" `
                  -Quiet
                if ($mode -eq "immediate" -and $ui -eq "no-ui" -and $unsupported) {
                  "Immediate 呈现模式不可用" | Out-File `
                    -FilePath "$output/windows-webgpu-immediate.unsupported.txt" -Encoding utf8
                  "| Windows Dawn | immediate | 不可用 | - | - | - |" | Out-File `
                    -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
                  break
                }
                throw "Windows Dawn 性能采样失败：$mode/$ui"
              }
              $profile = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
              if ($profile.backend -ne "webgpu" -or $profile.sample_frames -ne 1000 -or
                  $profile.milliseconds.cpu_frame.sample_count -ne 1000) {
                throw "Windows Dawn 性能报告不完整：$mode/$ui"
              }
              "| Windows Dawn | $mode | $ui | $($profile.milliseconds.cpu_frame.p50) | " +
                "$($profile.milliseconds.cpu_frame.p95) | " +
                "$($profile.milliseconds.gpu_frame.p50) |" | Out-File `
                  -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
      - name: 上传 Windows 模型查看器性能报告
        if: ${{ always() && steps.integration.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: s13-model-viewer-windows-webgpu-performance
          path: ${{ runner.temp }}/granit-webgpu-build/test-artifacts/s13-model-viewer/performance
          if-no-files-found: error
          retention-days: 7
      - name: 上传 Windows 模型查看器失败产物
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: s13-model-viewer-windows-webgpu
          path: ${{ runner.temp }}/granit-webgpu-build/test-artifacts/s13-model-viewer
          if-no-files-found: ignore
          retention-days: 7

  linux:
    if: ${{ inputs.run_linux }}
    needs: model-viewer-reference
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 安装运行依赖
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang libegl1-mesa-dev libvulkan-dev mesa-vulkan-drivers ninja-build \
            vulkan-validationlayers \
            libx11-dev libx11-xcb-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev \
            libxinerama-dev libxkbcommon-dev libxrandr-dev \
            jq libwayland-dev libxss-dev libxtst-dev wayland-protocols weston xauth xvfb
      - name: 下载并校验 Linux Dawn SDK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="granit-dawn-static-$DAWN_VERSION-linux-x64"
          gh release download "$DAWN_SDK_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$name.tar.gz" --pattern "$name.tar.gz.sha256"
          sha256sum --check "$name.tar.gz.sha256"
          mkdir -p stage
          tar -xzf "$name.tar.gz" -C stage
      - name: 下载 FlightHelmet Vulkan 参考图
        uses: actions/download-artifact@v6
        with:
          name: s13-model-viewer-reference
          path: ${{ runner.temp }}/model-viewer-reference
      - name: 构建并运行 Linux WebGPU 集成测试
        id: integration
        shell: bash
        run: |
          stage="$PWD/stage/granit-dawn-static-$DAWN_VERSION-linux-x64"
          build="$RUNNER_TEMP/granit-webgpu-build"
          vertex_asset="$RUNNER_TEMP/s10c_tool_triangle.vert.granit-shader"
          fragment_asset="$RUNNER_TEMP/s10c_tool_triangle.frag.granit-shader"
          CC=clang CXX=clang++ cmake -S . -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGRANIT_BUILD_BACKEND_WEBGPU=ON \
            -DGRANIT_WEBGPU_FORCE_FALLBACK_ADAPTER=ON \
            -DGRANIT_DAWN_ROOT="$stage" \
            -DGRANIT_S10C_VERTEX_SHADER_ASSET="$vertex_asset" \
            -DGRANIT_S10C_FRAGMENT_SHADER_ASSET="$fragment_asset" \
            -DGRANIT_BUILD_EXAMPLES=ON \
            -DGRANIT_BUILD_MODEL_VIEWER_EXAMPLE=ON \
            -DGRANIT_FETCH_EXAMPLE_GLTF_DEPENDENCIES=ON \
            -DGRANIT_BUILD_INTEGRATION_SDL3=ON \
            -DGRANIT_BUILD_INTEGRATION_IMGUI=ON \
            -DGRANIT_FETCH_INTEGRATION_DEPENDENCIES=ON \
            -DGRANIT_BUILD_TOOLS=ON \
            -DGRANIT_BUILD_TESTING=ON \
            -DGRANIT_ENABLE_XCB=OFF \
            -DGRANIT_ENABLE_WAYLAND=ON
          grep -q '^SDL_WAYLAND:BOOL=ON$' "$build/CMakeCache.txt"
          cmake --build "$build" --target granit_webgpu_plugin_smoke \
            granit_renderer_test granit_shader_tool granit_model_viewer_offscreen_acceptance \
            granit_model_viewer_example
          shader_tool="$build/bin/granit_shader_tool"
          "$shader_tool" compile --tint "$stage/bin/tint" \
            --input "$PWD/tests/fixtures/shaders/s10c_triangle.wgsl" --entry vs_main \
            --stage vertex --output "$RUNNER_TEMP/s10c_tool_triangle.vert.spv" \
            --asset "$vertex_asset" --tint-revision "$DAWN_REVISION"
          "$shader_tool" compile --tint "$stage/bin/tint" \
            --input "$PWD/tests/fixtures/shaders/s10c_triangle.wgsl" --entry fs_main \
            --stage fragment --output "$RUNNER_TEMP/s10c_tool_triangle.frag.spv" \
            --asset "$fragment_asset" --tint-revision "$DAWN_REVISION"
          lvp_icd="$(find /usr/share/vulkan/icd.d -type f -name 'lvp_icd*.json' -print -quit)"
          [[ -n "$lvp_icd" ]]
          VK_DRIVER_FILES="$lvp_icd" LIBGL_ALWAYS_SOFTWARE=1 \
            ctest --test-dir "$build" -R granit.backend.webgpu_plugin_smoke \
              --verbose --output-on-failure
          VK_DRIVER_FILES="$lvp_icd" LIBGL_ALWAYS_SOFTWARE=1 \
            "$build/bin/granit_renderer_test" '[pipeline][bind-group][smoke]'
      - name: 验证 Linux Dawn FlightHelmet 截图
        shell: bash
        run: |
          build="$RUNNER_TEMP/granit-webgpu-build"
          assets="$RUNNER_TEMP/granit-flight-helmet"
          output="$build/test-artifacts/s13-model-viewer"
          cmake -DGRANIT_SOURCE_DIR="$PWD" \
            -DGRANIT_FLIGHT_HELMET_OUTPUT_DIR="$assets" \
            -P cmake/fetch_flight_helmet.cmake
          mkdir -p "$output"
          cp examples/assets/FlightHelmet.manifest.json "$output/"
          lvp_icd="$(find /usr/share/vulkan/icd.d -type f -name 'lvp_icd*.json' -print -quit)"
          [[ -n "$lvp_icd" ]]
          VK_DRIVER_FILES="$lvp_icd" LIBGL_ALWAYS_SOFTWARE=1 \
            "$build/bin/granit_model_viewer_offscreen_acceptance" \
              --asset "$assets/glTF/FlightHelmet.gltf" \
              --output "$output/flight-helmet-linux-webgpu.rgba" \
              --expected "$RUNNER_TEMP/model-viewer-reference/flight-helmet-vulkan.rgba" \
              --backend=webgpu \
              --backend-library "$build/lib/libgranit_backend_webgpu.so" \
              --validation 2>&1 | tee "$output/acceptance.log"
      - name: 采集 Linux Dawn 模型查看器性能
        if: ${{ always() && steps.integration.outcome == 'success' }}
        shell: bash
        run: |
          build="$RUNNER_TEMP/granit-webgpu-build"
          assets="$RUNNER_TEMP/granit-flight-helmet"
          output="$build/test-artifacts/s13-model-viewer/performance"
          executable="$build/bin/granit_model_viewer_example"
          plugin="$build/lib/libgranit_backend_webgpu.so"
          mkdir -p "$output"
          lvp_icd="$(find /usr/share/vulkan/icd.d -type f -name 'lvp_icd*.json' -print -quit)"
          [[ -n "$lvp_icd" ]]
          runtime="$RUNNER_TEMP/granit-wayland-runtime"
          socket="wayland-granit"
          mkdir -p "$runtime"
          chmod 700 "$runtime"
          XDG_RUNTIME_DIR="$runtime" weston --backend=headless-backend.so \
            --socket="$socket" --idle-time=0 --log="$output/weston.log" &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for _ in {1..50}; do
            [[ -S "$runtime/$socket" ]] && break
            sleep 0.1
          done
          [[ -S "$runtime/$socket" ]]
          printf '%s\n' \
            '| 平台 | 呈现模式 | UI | CPU p50 (ms) | CPU p95 (ms) | GPU p50 (ms) |' \
            '| --- | --- | --- | ---: | ---: | ---: |' >> "$GITHUB_STEP_SUMMARY"
          for mode in fifo immediate; do
            for ui in no-ui ui; do
              report="$output/linux-webgpu-$mode-$ui.json"
              log="$output/linux-webgpu-$mode-$ui.log"
              arguments=(
                --asset "$assets/glTF/FlightHelmet.gltf"
                --backend=webgpu --backend-library "$plugin"
                "--present-mode=$mode" --profile-output "$report"
              )
              if [[ "$ui" == no-ui ]]; then arguments+=(--no-ui); fi
              set +e
              XDG_RUNTIME_DIR="$runtime" WAYLAND_DISPLAY="$socket" SDL_VIDEODRIVER=wayland \
                VK_DRIVER_FILES="$lvp_icd" LIBGL_ALWAYS_SOFTWARE=1 \
                "$executable" "${arguments[@]}" 2>&1 | tee "$log"
              status="${PIPESTATUS[0]}"
              set -e
              if ((status != 0)); then
                if [[ "$mode" == immediate && "$ui" == no-ui ]] &&
                   grep -Fq 'unsupported operation' "$log"; then
                  printf '%s\n' 'Immediate 呈现模式不可用' \
                    > "$output/linux-webgpu-immediate.unsupported.txt"
                  printf '%s\n' '| Linux Dawn | immediate | 不可用 | - | - | - |' \
                    >> "$GITHUB_STEP_SUMMARY"
                  break
                fi
                exit "$status"
              fi
              jq -e '
                .backend == "webgpu" and
                .sample_frames == 1000 and
                .milliseconds.cpu_frame.sample_count == 1000
              ' "$report" >/dev/null
              printf '| Linux Dawn | %s | %s | %s | %s | %s |\n' \
                "$mode" "$ui" \
                "$(jq -r '.milliseconds.cpu_frame.p50' "$report")" \
                "$(jq -r '.milliseconds.cpu_frame.p95' "$report")" \
                "$(jq -r '.milliseconds.gpu_frame.p50' "$report")" \
                >> "$GITHUB_STEP_SUMMARY"
            done
          done
      - name: 上传 Linux 模型查看器性能报告
        if: ${{ always() && steps.integration.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: s13-model-viewer-linux-webgpu-performance
          path: ${{ runner.temp }}/granit-webgpu-build/test-artifacts/s13-model-viewer/performance
          if-no-files-found: error
          retention-days: 7
      - name: 上传 Linux 模型查看器失败产物
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: s13-model-viewer-linux-webgpu
          path: ${{ runner.temp }}/granit-webgpu-build/test-artifacts/s13-model-viewer
          if-no-files-found: ignore
          retention-days: 7
