name: Linux CI Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/ci/linux/Dockerfile
      - .github/workflows/linux-ci-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并发布镜像
        uses: docker/build-push-action@v6
        with:
          context: .github/ci/linux
          push: true
          tags: ghcr.io/synchronized/granit-ci:ubuntu-24.04-v2
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
