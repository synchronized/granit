name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要验证的发布标签，例如 v0.2.0"
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  SCCACHE_GHA_ENABLED: "true"
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 500M

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 校验标签与项目版本
        run: >-
          cmake -DGRANIT_SOURCE_DIR="$PWD" -DGRANIT_RELEASE_TAG="$RELEASE_TAG"
          -P tests/cmake/check_release_version.cmake

  windows-package:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        linkage: [shared, static]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-msvc
        with:
          arch: x64
      - name: 启用 MSVC 编译缓存
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: 恢复锁定 Shader 工具链
        uses: actions/cache@v5
        with:
          path: build/toolchains
          key: >-
            shader-toolchain-${{ runner.os }}-
            ${{ hashFiles('cmake/toolchain/download_shader_toolchain.cmake',
            'cmake/toolchain/GranitShaderToolchain.cmake') }}
      - name: 选择 preset 和产物名
        id: package
        shell: pwsh
        run: |
          $suffix = if ('${{ matrix.linkage }}' -eq 'static') { '-static' } else { '' }
          "preset=windows-msvc${suffix}-release" >> $env:GITHUB_OUTPUT
          "name=granit-$($env:RELEASE_TAG.TrimStart('v'))-windows-x64-${{ matrix.linkage }}" `
            >> $env:GITHUB_OUTPUT
      - name: 配置、构建与测试
        shell: pwsh
        run: |
          cmake --preset '${{ steps.package.outputs.preset }}' `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build --preset '${{ steps.package.outputs.preset }}'
          # 托管 Windows Runner 没有 Vulkan ICD；完整 GPU 门禁由 Linux 发布矩阵执行。
          ctest --preset '${{ steps.package.outputs.preset }}' `
            -LE '^(gpu|platform)$' -E '^granit\.example\.'
      - name: 安装并打包
        shell: pwsh
        run: |
          $stage = "$PWD/stage/${{ steps.package.outputs.name }}"
          cmake --install "build/${{ steps.package.outputs.preset }}" --prefix $stage
          cmake `
            -DGRANIT_SOURCE_DIR="$PWD" `
            -DGRANIT_BUILD_DIR="$PWD/build/${{ steps.package.outputs.preset }}" `
            -DGRANIT_INSTALL_PREFIX="$stage" `
            -P tests/cmake/check_install_exports.cmake
          Compress-Archive -Path $stage -DestinationPath "${{ steps.package.outputs.name }}.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.zip
          if-no-files-found: error

  linux-package:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    container:
      image: >-
        ghcr.io/synchronized/granit-ci@sha256:6a2d0aba3b2464838958a4259d3a343106205eb35df9f4ad24d060bf98739015
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        linkage: [shared, static]
    steps:
      - uses: actions/checkout@v5
      - name: 恢复编译缓存
        uses: actions/cache@v5
        with:
          path: .cache/ccache
          key: >-
            release-linux-ccache-v1-${{ matrix.linkage }}-${{ github.sha }}
          restore-keys: |
            release-linux-ccache-v1-${{ matrix.linkage }}-
      - name: 恢复锁定 Shader 工具链
        uses: actions/cache@v5
        with:
          path: build/toolchains
          key: >-
            shader-toolchain-${{ runner.os }}-
            ${{ hashFiles('cmake/toolchain/download_shader_toolchain.cmake',
            'cmake/toolchain/GranitShaderToolchain.cmake') }}
      - name: 选择 preset 和产物名
        id: package
        shell: bash
        run: |
          suffix=""
          if [[ "${{ matrix.linkage }}" == "static" ]]; then suffix="-static"; fi
          echo "preset=linux-clang${suffix}-release" >> "$GITHUB_OUTPUT"
          echo "name=granit-${RELEASE_TAG#v}-linux-x64-${{ matrix.linkage }}" >> "$GITHUB_OUTPUT"
      - name: 配置、构建与测试
        shell: bash
        run: |
          ccache --zero-stats
          cmake --preset "${{ steps.package.outputs.preset }}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset "${{ steps.package.outputs.preset }}"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/granit-release-wayland"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=granit-release-wayland
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            >"$RUNNER_TEMP/granit-release-weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break
            sleep 0.1
          done
          [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]
          xvfb-run -a ctest --preset "${{ steps.package.outputs.preset }}"
      - name: 安装并打包
        shell: bash
        run: |
          stage="$PWD/stage/${{ steps.package.outputs.name }}"
          cmake --install "build/${{ steps.package.outputs.preset }}" --prefix "$stage"
          cmake \
            -DGRANIT_SOURCE_DIR="$PWD" \
            -DGRANIT_BUILD_DIR="$PWD/build/${{ steps.package.outputs.preset }}" \
            -DGRANIT_INSTALL_PREFIX="$stage" \
            -P tests/cmake/check_install_exports.cmake
          tar -C "$PWD/stage" -czf "${{ steps.package.outputs.name }}.tar.gz" \
            "${{ steps.package.outputs.name }}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error
      - name: 输出编译缓存统计
        if: always()
        shell: bash
        run: ccache --show-stats

  checksums:
    if: github.event_name == 'workflow_dispatch'
    needs: [windows-package, linux-package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: 生成 SHA-256 校验文件
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          sha256sum granit-* > SHA256SUMS
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{schema_version: 1, tag: $tag, commit: $commit, workflow_run_id: $run_id}' \
            > release-manifest.json
      - uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: 获取并校验同提交的发布候选产物
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t runs < <(
            gh run list --repo "$GITHUB_REPOSITORY" --workflow Release \
              --commit "$GITHUB_SHA" --event workflow_dispatch --status success \
              --limit 20 --json databaseId --jq '.[].databaseId'
          )
          for run_id in "${runs[@]}"; do
            rm -rf candidate
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name release-assets --dir candidate 2>/dev/null; then
              continue
            fi
            if [[ -f candidate/release-manifest.json &&
                  "$(jq -r .schema_version candidate/release-manifest.json)" == "1" &&
                  "$(jq -r .tag candidate/release-manifest.json)" == "$RELEASE_TAG" &&
                  "$(jq -r .commit candidate/release-manifest.json)" == "$GITHUB_SHA" &&
                  "$(jq -r .workflow_run_id candidate/release-manifest.json)" == "$run_id" ]]; then
              mv candidate dist
              break
            fi
          done
          test -f dist/release-manifest.json || {
            echo "找不到标签和提交均匹配的成功 Release Candidate 产物" >&2
            exit 1
          }
          (cd dist && sha256sum --check SHA256SUMS)
          version="${RELEASE_TAG#v}"
          for name in \
            "granit-$version-linux-x64-shared.tar.gz" \
            "granit-$version-linux-x64-static.tar.gz" \
            "granit-$version-windows-x64-shared.zip" \
            "granit-$version-windows-x64-static.zip"; do
            test -s "dist/$name"
          done
          test "$(find dist -maxdepth 1 -type f -name 'granit-*' | wc -l)" -eq 4
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm dist/release-manifest.json
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Granit ${RELEASE_TAG#v}" --generate-notes

  verify-public-release:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: 从公开 Release 重新下载并校验产物
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          (cd dist && sha256sum --check SHA256SUMS)
          version="${RELEASE_TAG#v}"
          for name in \
            "granit-$version-linux-x64-shared.tar.gz" \
            "granit-$version-linux-x64-static.tar.gz" \
            "granit-$version-windows-x64-shared.zip" \
            "granit-$version-windows-x64-static.zip"; do
            test -s "dist/$name"
          done
          test "$(find dist -maxdepth 1 -type f -name 'granit-*' | wc -l)" -eq 4
          for archive in dist/granit-*.tar.gz; do
            test "$(tar -tzf "$archive" | cut -d/ -f1 | sort -u | wc -l)" -eq 1
          done
          for archive in dist/granit-*.zip; do
            test "$(unzip -Z1 "$archive" | tr '\\' '/' | cut -d/ -f1 | sort -u | wc -l)" -eq 1
          done
