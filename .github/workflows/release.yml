name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要创建的发布标签，例如 v0.27.0"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  VULKAN_LOADER_REF: a9e72c66d5cb79911eb9a9063bf4016dd0a3a123
  VULKAN_HEADERS_REF: 8864cdc896bbc2a9b6eb36b3218fc9ef57908d77
  VULKAN_VALIDATION_REF: b9d4f9ead8d97c1bb0d174ea07d8aed8273818a5
  SCCACHE_GHA_ENABLED: "true"
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 500M

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 校验发布来源与标签唯一性
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if [[ -n "$remote_tag" ]]; then
            echo "标签 $RELEASE_TAG 已存在，将按幂等发布流程更新或创建 Release"
          fi
      - name: 校验标签与项目版本
        run: >-
          cmake -DGRANIT_SOURCE_DIR="$PWD" -DGRANIT_RELEASE_TAG="$RELEASE_TAG"
          -P tests/packaging/check_release_version.cmake

  windows-package:
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-msvc
        with:
          arch: x64
      - name: 启用 MSVC 编译缓存
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: 准备锁定 Shader 工具链
        id: shader-toolchain
        uses: ./.github/actions/setup-shader-toolchain
      - name: 设置 preset 和产物名
        id: package
        shell: pwsh
        run: |
          "preset=windows-msvc-release" >> $env:GITHUB_OUTPUT
          "name=granit-$($env:RELEASE_TAG.TrimStart('v'))-windows-x64-shared" `
            >> $env:GITHUB_OUTPUT
      - name: 配置、构建与测试
        shell: pwsh
        run: |
          cmake --preset '${{ steps.package.outputs.preset }}' `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DGRANIT_BUILD_TOOLS=ON `
            -DGRANIT_BUILD_ASSET_TOOLS=ON
          cmake --build --preset '${{ steps.package.outputs.preset }}'
          # 托管 Windows Runner 没有 Vulkan ICD；完整 GPU 门禁由 Linux 发布矩阵执行。
          ctest --preset '${{ steps.package.outputs.preset }}' `
            -LE '^(gpu|platform)$' -E '^granit\.example\.'
      - name: 安装并打包
        shell: pwsh
        run: |
          $stage = "$PWD/stage/${{ steps.package.outputs.name }}"
          cmake --install "build/${{ steps.package.outputs.preset }}" --prefix $stage
          cmake `
            -DGRANIT_SOURCE_DIR="$PWD" `
            -DGRANIT_BUILD_DIR="$PWD/build/${{ steps.package.outputs.preset }}" `
            -DGRANIT_INSTALL_PREFIX="$stage" `
            -P tests/cmake/check_install_exports.cmake
          cmake `
            -DGRANIT_SOURCE_DIR="$PWD" `
            -DGRANIT_INSTALL_PREFIX="$stage" `
            -DGRANIT_TEST_BINARY_DIR="$PWD/build/release-package/windows" `
            -DGRANIT_TEST_SHADER_TOOLCHAIN_ROOT="${{ steps.shader-toolchain.outputs.root }}" `
            -P tests/packaging/check_installed_package.cmake
          if ($LASTEXITCODE -ne 0) { throw '安装 SDK 消费验证失败' }
          Compress-Archive -Path $stage -DestinationPath "${{ steps.package.outputs.name }}.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.zip
          if-no-files-found: error

  linux-package:
    needs: validate
    runs-on: ubuntu-24.04
    container:
      image: >-
        ghcr.io/synchronized/granit-ci@sha256:6a2d0aba3b2464838958a4259d3a343106205eb35df9f4ad24d060bf98739015
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: 恢复编译缓存
        uses: actions/cache@v5
        with:
          path: .cache/ccache
          key: >-
            release-linux-ccache-v1-shared-${{ github.sha }}
          restore-keys: |
            release-linux-ccache-v1-shared-
      - name: 准备锁定 Shader 工具链
        id: shader-toolchain
        uses: ./.github/actions/setup-shader-toolchain
      - name: 设置 preset 和产物名
        id: package
        shell: bash
        run: |
          echo "preset=linux-clang-release" >> "$GITHUB_OUTPUT"
          echo "name=granit-${RELEASE_TAG#v}-linux-x64-shared" >> "$GITHUB_OUTPUT"
      - name: 配置、构建与测试
        shell: bash
        run: |
          ccache --zero-stats
          cmake --preset "${{ steps.package.outputs.preset }}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGRANIT_BUILD_TOOLS=ON \
            -DGRANIT_BUILD_ASSET_TOOLS=ON
          cmake --build --preset "${{ steps.package.outputs.preset }}"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/granit-release-wayland"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=granit-release-wayland
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            >"$RUNNER_TEMP/granit-release-weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break
            sleep 0.1
          done
          [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]
          xvfb-run -a ctest --preset "${{ steps.package.outputs.preset }}"
      - name: 安装并打包
        shell: bash
        run: |
          stage="$PWD/stage/${{ steps.package.outputs.name }}"
          cmake --install "build/${{ steps.package.outputs.preset }}" --prefix "$stage"
          cmake \
            -DGRANIT_SOURCE_DIR="$PWD" \
            -DGRANIT_BUILD_DIR="$PWD/build/${{ steps.package.outputs.preset }}" \
            -DGRANIT_INSTALL_PREFIX="$stage" \
            -P tests/cmake/check_install_exports.cmake
          cmake \
            -DGRANIT_SOURCE_DIR="$PWD" \
            -DGRANIT_INSTALL_PREFIX="$stage" \
            -DGRANIT_TEST_BINARY_DIR="$PWD/build/release-package/linux" \
            -DGRANIT_TEST_SHADER_TOOLCHAIN_ROOT="${{ steps.shader-toolchain.outputs.root }}" \
            -P tests/packaging/check_installed_package.cmake
          xvfb-run -a ctest --test-dir "$PWD/build/release-package/linux/standalone-window-clear" \
            --output-on-failure
          xvfb-run -a ctest --test-dir "$PWD/build/release-package/linux/standalone-triangle" \
            --output-on-failure
          xvfb-run -a ctest \
            --test-dir "$PWD/build/release-package/linux/standalone-triangle-source" \
            --output-on-failure
          tar -C "$PWD/stage" -czf "${{ steps.package.outputs.name }}.tar.gz" \
            "${{ steps.package.outputs.name }}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error
      - name: 输出编译缓存统计
        if: always()
        shell: bash
        run: ccache --show-stats

  windows-vulkan-runtime:
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-msvc
        with:
          arch: x64
      - name: 构建锁定的 Khronos Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = "$env:RUNNER_TEMP/granit-vulkan-runtime-source"
          $headers = "$source/headers"
          $loader = "$source/loader"
          $validation = "$source/validation"
          git clone --filter=blob:none https://github.com/KhronosGroup/Vulkan-Headers.git $headers
          git -C $headers checkout --detach $env:VULKAN_HEADERS_REF
          git clone --filter=blob:none https://github.com/KhronosGroup/Vulkan-Loader.git $loader
          git -C $loader checkout --detach $env:VULKAN_LOADER_REF
          git clone --filter=blob:none https://github.com/KhronosGroup/Vulkan-ValidationLayers.git $validation
          git -C $validation checkout --detach $env:VULKAN_VALIDATION_REF
          cmake -S $headers -B "$source/headers-build" -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_INSTALL_PREFIX=$source/headers-install"
          cmake --build "$source/headers-build" --target install
          cmake -S $loader -B "$source/loader-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DUPDATE_DEPS=OFF "-DVULKAN_HEADERS_INSTALL_DIR=$source/headers-install" "-DCMAKE_INSTALL_PREFIX=$source/loader-install"
          cmake --build "$source/loader-build" --target install
          cmake -S $validation -B "$source/validation-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_WERROR=OFF "-DCMAKE_INSTALL_PREFIX=$source/validation-install"
          cmake --build "$source/validation-build" --target install
          $stage = "$PWD/stage/granit-vulkan-runtime-windows-x64"
          New-Item -ItemType Directory -Force "$stage/bin", "$stage/validation", "$stage/LICENSES" | Out-Null
          Copy-Item "$source/loader-install/bin/vulkan-1.dll" "$stage/bin/"
          Copy-Item "$source/validation-install/bin/VkLayer_khronos_validation.dll" "$stage/validation/"
          Copy-Item "$source/validation-install/bin/VkLayer_khronos_validation.json" "$stage/validation/"
          Copy-Item "$loader/LICENSE.txt" "$stage/LICENSES/Vulkan-Loader-LICENSE.txt"
          Copy-Item "$validation/LICENSE.txt" "$stage/LICENSES/Vulkan-ValidationLayers-LICENSE.txt"
          Copy-Item "$headers/LICENSE.md" "$stage/LICENSES/Vulkan-Headers-LICENSE.md"
          cmake -DSTAGE="$stage" -DOUTPUT="$PWD/granit-vulkan-runtime-windows-x64.zip" -DCOMPONENT=runtime -DPLATFORM=windows -DARCH=x64 -DLOADER_VERSION=1.4.350 -DVALIDATION_VERSION=1.4.350.0 '-DLOADER_FILES:STRING=bin/vulkan-1.dll' '-DVALIDATION_FILES:STRING=validation/VkLayer_khronos_validation.dll;validation/VkLayer_khronos_validation.json' '-DLICENSE_FILES:STRING=LICENSES/Vulkan-Loader-LICENSE.txt;LICENSES/Vulkan-ValidationLayers-LICENSE.txt;LICENSES/Vulkan-Headers-LICENSE.md' -P cmake/vulkan/package_vulkan_runtime.cmake
      - uses: actions/upload-artifact@v6
        with:
          name: granit-vulkan-runtime-windows-x64
          path: granit-vulkan-runtime-windows-x64.zip
          if-no-files-found: error

  linux-vulkan-runtime:
    needs: validate
    runs-on: ubuntu-24.04
    container:
      image: >-
        ghcr.io/synchronized/granit-ci@sha256:6a2d0aba3b2464838958a4259d3a343106205eb35df9f4ad24d060bf98739015
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: 构建锁定的 Khronos Runtime
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/granit-vulkan-runtime-source"
          git clone --filter=blob:none https://github.com/KhronosGroup/Vulkan-Headers.git "$source/headers"
          git -C "$source/headers" checkout --detach "$VULKAN_HEADERS_REF"
          git clone --filter=blob:none https://github.com/KhronosGroup/Vulkan-Loader.git "$source/loader"
          git -C "$source/loader" checkout --detach "$VULKAN_LOADER_REF"
          git clone --filter=blob:none https://github.com/KhronosGroup/Vulkan-ValidationLayers.git "$source/validation"
          git -C "$source/validation" checkout --detach "$VULKAN_VALIDATION_REF"
          cmake -S "$source/headers" -B "$source/headers-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$source/headers-install"
          cmake --build "$source/headers-build" --target install
          cmake -S "$source/loader" -B "$source/loader-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DUPDATE_DEPS=OFF -DVULKAN_HEADERS_INSTALL_DIR="$source/headers-install" -DCMAKE_INSTALL_PREFIX="$source/loader-install"
          cmake --build "$source/loader-build" --target install
          cmake -S "$source/validation" -B "$source/validation-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_WERROR=OFF -DCMAKE_INSTALL_PREFIX="$source/validation-install"
          cmake --build "$source/validation-build" --target install
          stage="$PWD/stage/granit-vulkan-runtime-linux-x64"
          install -d "$stage/lib" "$stage/validation" "$stage/LICENSES"
          cp "$source/loader-install/lib/libvulkan.so.1" "$stage/lib/"
          cp "$source/validation-install/lib/libVkLayer_khronos_validation.so" "$stage/validation/"
          cp "$source/validation-install/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json" "$stage/validation/"
          cp "$source/loader/LICENSE.txt" "$stage/LICENSES/Vulkan-Loader-LICENSE.txt"
          cp "$source/validation/LICENSE.txt" "$stage/LICENSES/Vulkan-ValidationLayers-LICENSE.txt"
          cp "$source/headers/LICENSE.md" "$stage/LICENSES/Vulkan-Headers-LICENSE.md"
          cmake -DSTAGE="$stage" -DOUTPUT="$PWD/granit-vulkan-runtime-linux-x64.tar" -DCOMPONENT=runtime -DPLATFORM=linux -DARCH=x64 -DLOADER_VERSION=1.4.350 -DVALIDATION_VERSION=1.4.350.0 '-DLOADER_FILES:STRING=lib/libvulkan.so.1' '-DVALIDATION_FILES:STRING=validation/libVkLayer_khronos_validation.so;validation/VkLayer_khronos_validation.json' '-DLICENSE_FILES:STRING=LICENSES/Vulkan-Loader-LICENSE.txt;LICENSES/Vulkan-ValidationLayers-LICENSE.txt;LICENSES/Vulkan-Headers-LICENSE.md' -DARCHIVE_FORMAT=gnutar -P cmake/vulkan/package_vulkan_runtime.cmake
          command -v zstd >/dev/null || (apt-get update -qq && apt-get install -y -qq zstd)
          zstd -q -f "$PWD/granit-vulkan-runtime-linux-x64.tar" -o "$PWD/granit-vulkan-runtime-linux-x64.tar.zst"
          rm "$PWD/granit-vulkan-runtime-linux-x64.tar"
      - uses: actions/upload-artifact@v6
        with:
          name: granit-vulkan-runtime-linux-x64
          path: granit-vulkan-runtime-linux-x64.tar.zst
          if-no-files-found: error

  checksums:
    needs: [windows-package, linux-package, windows-vulkan-runtime, linux-vulkan-runtime]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: 生成 SHA-256 校验文件
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          sha256sum granit-* > SHA256SUMS
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{schema_version: 1, tag: $tag, commit: $commit, workflow_run_id: $run_id}' \
            > release-manifest.json
      - uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    needs: checksums
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: dist
      - name: 校验待发布产物
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .schema_version dist/release-manifest.json)" = "1"
          test "$(jq -r .tag dist/release-manifest.json)" = "$RELEASE_TAG"
          test "$(jq -r .commit dist/release-manifest.json)" = "$GITHUB_SHA"
          test "$(jq -r .workflow_run_id dist/release-manifest.json)" = "$GITHUB_RUN_ID"
          (cd dist && sha256sum --check SHA256SUMS)
          version="${RELEASE_TAG#v}"
          for name in \
            "granit-$version-linux-x64-shared.tar.gz" \
            "granit-$version-windows-x64-shared.zip" \
            "granit-vulkan-runtime-linux-x64.tar.zst" \
            "granit-vulkan-runtime-windows-x64.zip"; do
            test -s "dist/$name"
          done
          test "$(find dist -maxdepth 1 -type f -name 'granit-*' | wc -l)" -eq 4
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm dist/release-manifest.json
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Granit ${RELEASE_TAG#v}" --generate-notes
          fi

  verify-public-release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: 从公开 Release 重新下载并校验产物
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          (cd dist && sha256sum --check SHA256SUMS)
          version="${RELEASE_TAG#v}"
          for name in \
            "granit-$version-linux-x64-shared.tar.gz" \
            "granit-$version-windows-x64-shared.zip" \
            "granit-vulkan-runtime-linux-x64.tar.zst" \
            "granit-vulkan-runtime-windows-x64.zip"; do
            test -s "dist/$name"
          done
          test "$(find dist -maxdepth 1 -type f -name 'granit-*' | wc -l)" -eq 4
          for archive in dist/granit-*-shared.tar.gz; do
            test "$(tar -tzf "$archive" | cut -d/ -f1 | sort -u | wc -l)" -eq 1
          done
          for archive in dist/granit-*-shared.zip; do
            test "$(unzip -Z1 "$archive" | tr '\\' '/' | cut -d/ -f1 | sort -u | wc -l)" -eq 1
          done
          runtime_zip=dist/granit-vulkan-runtime-windows-x64.zip
          for path in \
            bin/vulkan-1.dll \
            validation/VkLayer_khronos_validation.dll \
            validation/VkLayer_khronos_validation.json \
            LICENSES/Vulkan-Loader-LICENSE.txt \
            LICENSES/Vulkan-ValidationLayers-LICENSE.txt \
            LICENSES/Vulkan-Headers-LICENSE.md \
            vulkan-runtime.json; do
            unzip -Z1 "$runtime_zip" | tr '\\' '/' | grep -Fx "$path" >/dev/null
          done
          zstd -q -d -f dist/granit-vulkan-runtime-linux-x64.tar.zst -o "$RUNNER_TEMP/granit-vulkan-runtime-linux-x64.tar"
          for path in \
            bin/libvulkan.so.1 \
            validation/libVkLayer_khronos_validation.so \
            validation/VkLayer_khronos_validation.json \
            LICENSES/Vulkan-Loader-LICENSE.txt \
            LICENSES/Vulkan-ValidationLayers-LICENSE.txt \
            LICENSES/Vulkan-Headers-LICENSE.md \
            vulkan-runtime.json; do
            tar -tf "$RUNNER_TEMP/granit-vulkan-runtime-linux-x64.tar" | sed 's#^\./##' | grep -Fx "$path" >/dev/null
          done
