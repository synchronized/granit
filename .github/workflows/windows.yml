name: Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "DOCUMENTATION_GUIDE.md"
  workflow_dispatch:

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  msvc-install-consumer:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        linkage: [shared, static]
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: 启用 MSVC 编译缓存
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: 选择 preset
        id: preset
        shell: pwsh
        run: |
          $suffix = if ('${{ matrix.linkage }}' -eq 'static') { '-static' } else { '' }
          "name=windows-msvc${suffix}-release" >> $env:GITHUB_OUTPUT
      - name: 配置、构建与测试
        shell: pwsh
        run: |
          cmake --preset '${{ steps.preset.outputs.name }}' `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build --preset '${{ steps.preset.outputs.name }}'
          # 托管 Windows Runner 没有 Vulkan ICD；GPU 运行测试由 Linux Lavapipe 矩阵覆盖。
          ctest --preset '${{ steps.preset.outputs.name }}' `
            -E 'granit\.renderer\.lifecycle_diagnostic|granit\.window_renderer|granit\.example\.'
      - name: 安装并审计包
        shell: pwsh
        run: |
          $preset = '${{ steps.preset.outputs.name }}'
          $prefix = "$PWD/build/install/$preset"
          cmake --install "build/$preset" --prefix $prefix
          cmake `
            -DGRANIT_SOURCE_DIR="$PWD" `
            -DGRANIT_BUILD_DIR="$PWD/build/$preset" `
            -DGRANIT_INSTALL_PREFIX="$prefix" `
            -P cmake/check_install_exports.cmake
          cmake `
            -DGRANIT_SOURCE_DIR="$PWD" `
            -DGRANIT_INSTALL_PREFIX="$prefix" `
            -DGRANIT_TEST_BINARY_DIR="$PWD/build/package/$preset" `
            -P cmake/check_installed_package.cmake
      - name: 构建并运行独立 C 和 C++ Consumer
        shell: pwsh
        run: |
          $preset = '${{ steps.preset.outputs.name }}'
          $prefix = "$PWD/build/install/$preset"
          $consumer = "$PWD/build/consumer/$preset"
          cmake -S tests/consumer -B $consumer -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$prefix" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build $consumer
          if ((Test-Path "$consumer/granit.dll") -or
              (Test-Path "$consumer/granit_render_pipeline.dll") -or
              (Test-Path "$consumer/granit_window.dll") -or
              (Test-Path "$consumer/granit_input.dll")) {
            throw 'Consumer 目录不应复制 Granit DLL'
          }
          if ('${{ matrix.linkage }}' -eq 'shared') {
            if ((-not (Test-Path "$prefix/bin/granit.dll")) -or
                (-not (Test-Path "$prefix/bin/granit_render_pipeline.dll")) -or
                (-not (Test-Path "$prefix/bin/granit_window.dll")) -or
                (-not (Test-Path "$prefix/bin/granit_input.dll"))) {
              throw '安装目录缺少共享库 DLL'
            }
          }
          ctest --test-dir $consumer --output-on-failure
