name: Linux

on:
  push:
  pull_request:

jobs:
  build-test-consumer:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        linkage: [shared, static]
    steps:
      - uses: actions/checkout@v4
      - name: 安装构建与软件 Vulkan 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan1 libxcb1-dev libwayland-dev \
            libxkbcommon-dev mesa-vulkan-drivers vulkan-validationlayers wayland-protocols \
            weston xvfb xauth
      - name: 选择 preset
        id: preset
        shell: bash
        run: |
          suffix=""
          if [[ "${{ matrix.linkage }}" == "static" ]]; then suffix="-static"; fi
          echo "name=linux-${{ matrix.compiler }}${suffix}-release" >> "$GITHUB_OUTPUT"
      - name: 配置、构建与测试
        shell: bash
        run: |
          cmake --preset "${{ steps.preset.outputs.name }}"
          cmake --build --preset "${{ steps.preset.outputs.name }}"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/granit-wayland"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=granit-wayland
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            >"$RUNNER_TEMP/granit-weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break
            sleep 0.1
          done
          [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] || {
            cat "$RUNNER_TEMP/granit-weston.log"
            exit 1
          }
          xvfb-run -a ctest --preset "${{ steps.preset.outputs.name }}"
      - name: 安装并验证独立 C 和 C++ Consumer
        shell: bash
        run: |
          prefix="$PWD/build/install/${{ steps.preset.outputs.name }}"
          cmake --install "build/${{ steps.preset.outputs.name }}" --prefix "$prefix"
          cmake \
            -DGRANIT_SOURCE_DIR="$PWD" \
            -DGRANIT_BUILD_DIR="$PWD/build/${{ steps.preset.outputs.name }}" \
            -DGRANIT_INSTALL_PREFIX="$prefix" \
            -P cmake/check_install_exports.cmake
          cmake \
            -DGRANIT_SOURCE_DIR="$PWD" \
            -DGRANIT_INSTALL_PREFIX="$prefix" \
            -DGRANIT_TEST_BINARY_DIR="$PWD/build/package/${{ steps.preset.outputs.name }}" \
            -P cmake/check_installed_package.cmake
          cmake -S tests/consumer -B "build/consumer/${{ steps.preset.outputs.name }}" \
            -G Ninja -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build "build/consumer/${{ steps.preset.outputs.name }}"
          LD_LIBRARY_PATH="$prefix/lib" \
            "build/consumer/${{ steps.preset.outputs.name }}/granit_c_consumer"
          LD_LIBRARY_PATH="$prefix/lib" \
            "build/consumer/${{ steps.preset.outputs.name }}/granit_cpp_consumer"
          LD_LIBRARY_PATH="$prefix/lib" \
            "build/consumer/${{ steps.preset.outputs.name }}/granit_pipeline_c_consumer"
          LD_LIBRARY_PATH="$prefix/lib" \
            "build/consumer/${{ steps.preset.outputs.name }}/granit_pipeline_cpp_consumer"
          LD_LIBRARY_PATH="$prefix/lib" \
            "build/consumer/${{ steps.preset.outputs.name }}/granit_window_c_consumer"
          LD_LIBRARY_PATH="$prefix/lib" \
            "build/consumer/${{ steps.preset.outputs.name }}/granit_input_c_consumer"
          LD_LIBRARY_PATH="$prefix/lib" \
            "build/consumer/${{ steps.preset.outputs.name }}/granit_input_cpp_consumer"

  integration-runtime:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        linkage: [shared, static]
    steps:
      - uses: actions/checkout@v4
      - name: 安装集成与软件 Vulkan 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan1 mesa-vulkan-drivers \
            vulkan-validationlayers xvfb xauth weston wayland-protocols libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev libx11-dev libx11-xcb-dev libxext-dev \
            libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxinerama-dev
      - name: 选择 preset
        id: preset
        shell: bash
        run: |
          suffix=""
          if [[ "${{ matrix.linkage }}" == "static" ]]; then suffix="-static"; fi
          echo "name=linux-clang${suffix}-release" >> "$GITHUB_OUTPUT"
      - name: 配置并构建 SDL3 与 ImGui Integration
        shell: bash
        run: |
          cmake --preset "${{ steps.preset.outputs.name }}" \
            -DGRANIT_BUILD_INTEGRATION_SDL3=ON \
            -DGRANIT_BUILD_INTEGRATION_IMGUI=ON \
            -DGRANIT_FETCH_INTEGRATION_DEPENDENCIES=ON
          cmake --build --preset "${{ steps.preset.outputs.name }}"
      - name: 运行 ImGui 转换测试
        shell: bash
        run: |
          ctest --test-dir "build/${{ steps.preset.outputs.name }}" \
            --output-on-failure -R '^granit\.integration\.imgui$'
      - name: 运行 X11 SDL3 与 ImGui smoke test
        shell: bash
        run: |
          xvfb-run -a env SDL_VIDEODRIVER=x11 \
            "build/${{ steps.preset.outputs.name }}/bin/granit_sdl3_window_clear_example" \
            --smoke-test
          xvfb-run -a env SDL_VIDEODRIVER=x11 \
            "build/${{ steps.preset.outputs.name }}/bin/granit_sdl3_imgui_example" --smoke-test
      - name: 运行 Wayland SDL3 与 ImGui smoke test
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/granit-integration-wayland"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=granit-integration-wayland
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            >"$RUNNER_TEMP/granit-integration-weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break
            sleep 0.1
          done
          [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] || {
            cat "$RUNNER_TEMP/granit-integration-weston.log"
            exit 1
          }
          SDL_VIDEODRIVER=wayland \
            "build/${{ steps.preset.outputs.name }}/bin/granit_sdl3_window_clear_example" \
            --smoke-test
          SDL_VIDEODRIVER=wayland \
            "build/${{ steps.preset.outputs.name }}/bin/granit_sdl3_imgui_example" --smoke-test
