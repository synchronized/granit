name: Linux

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "cmake/granit_version.cmake"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 500M

jobs:
  restore-shader-toolchain:
    runs-on: ubuntu-24.04
    container:
      image: >-
        ghcr.io/synchronized/granit-ci@sha256:6a2d0aba3b2464838958a4259d3a343106205eb35df9f4ad24d060bf98739015
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: 准备锁定 Shader 工具链
        id: shader-toolchain
        uses: ./.github/actions/setup-shader-toolchain
      - name: 验证锁定 Shader 工具链
        shell: bash
        run: |
          root="${{ steps.shader-toolchain.outputs.root }}"
          export LD_LIBRARY_PATH="$root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          CC=clang CXX=clang++ cmake -S . -B build/shader-toolchain-test -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGRANIT_BUILD_EXAMPLES=OFF \
            -DGRANIT_BUILD_TESTING=ON \
            -DGRANIT_BUILD_TOOLS=ON \
            -DGRANIT_SHADER_TOOLCHAIN_ROOT="$root" \
            -DGRANIT_SHADER_TOOLCHAIN_POLICY=locked \
            -DGRANIT_TINT_REVISION=0bc38adde72b79013536f8ce354b639ae19ae195
          cmake --build build/shader-toolchain-test --target \
            granit_asset_tools_shader_hlsl_api_test
          ctest --test-dir build/shader-toolchain-test \
            -R 'granit\.asset_tools\.shader\.hlsl_api' --output-on-failure

  build-test-consumer:
    needs: restore-shader-toolchain
    runs-on: ubuntu-24.04
    container:
      image: >-
        ghcr.io/synchronized/granit-ci@sha256:6a2d0aba3b2464838958a4259d3a343106205eb35df9f4ad24d060bf98739015
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        linkage: [shared, static]
    steps:
      - uses: actions/checkout@v5
      - name: 准备锁定 Shader 工具链
        id: shader-toolchain
        uses: ./.github/actions/setup-shader-toolchain
      - name: 恢复编译缓存
        uses: actions/cache@v5
        with:
          path: .cache/ccache
          key: >-
            linux-ccache-v2-${{ matrix.compiler }}-${{ matrix.linkage }}-${{ github.sha }}
          restore-keys: |
            linux-ccache-v2-${{ matrix.compiler }}-${{ matrix.linkage }}-
      - name: 选择 preset
        id: preset
        shell: bash
        run: |
          suffix=""
          if [[ "${{ matrix.linkage }}" == "static" ]]; then suffix="-static"; fi
          echo "name=linux-${{ matrix.compiler }}${suffix}-release" >> "$GITHUB_OUTPUT"
      - name: 配置、构建与测试
        shell: bash
        run: |
          ccache --zero-stats
          cmake --preset "${{ steps.preset.outputs.name }}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset "${{ steps.preset.outputs.name }}"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/granit-wayland"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=granit-wayland
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            >"$RUNNER_TEMP/granit-weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break
            sleep 0.1
          done
          [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] || {
            cat "$RUNNER_TEMP/granit-weston.log"
            exit 1
          }
          xvfb-run -a ctest --preset "${{ steps.preset.outputs.name }}"
      - name: 失败时重跑资源测试并生成 Frame Trace
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          build="build/${{ steps.preset.outputs.name }}"
          mkdir -p "$build/diagnostics"
          GRANIT_FRAME_TRACE="$PWD/$build/diagnostics/frame-trace.jsonl" \
            GRANIT_FRAME_TRACE_MAX_EVENTS=512 \
            xvfb-run -a ctest --test-dir "$build" \
              -R '^granit\.renderer\.resources$' --output-on-failure
      - name: 上传渲染 Fixture 失败诊断
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: s12-fixture-linux-${{ matrix.compiler }}-${{ matrix.linkage }}
          path: |
            build/${{ steps.preset.outputs.name }}/test-artifacts
            build/${{ steps.preset.outputs.name }}/diagnostics
          if-no-files-found: ignore
      - name: 安装并验证独立 C 和 C++ Consumer
        shell: bash
        run: |
          prefix="$PWD/build/install/${{ steps.preset.outputs.name }}"
          cmake --install "build/${{ steps.preset.outputs.name }}" --prefix "$prefix"
          cmake \
            -DGRANIT_SOURCE_DIR="$PWD" \
            -DGRANIT_BUILD_DIR="$PWD/build/${{ steps.preset.outputs.name }}" \
            -DGRANIT_INSTALL_PREFIX="$prefix" \
            -P tests/cmake/check_install_exports.cmake
          cmake \
            -DGRANIT_SOURCE_DIR="$PWD" \
            -DGRANIT_INSTALL_PREFIX="$prefix" \
            -DGRANIT_TEST_BINARY_DIR="$PWD/build/package/${{ steps.preset.outputs.name }}" \
            -DGRANIT_TEST_SHADER_TOOLCHAIN_ROOT="${{ steps.shader-toolchain.outputs.root }}" \
            -P tests/packaging/check_installed_package.cmake
          xvfb-run -a ctest \
            --test-dir "$PWD/build/package/${{ steps.preset.outputs.name }}/standalone-window-clear" \
            --output-on-failure
          xvfb-run -a ctest \
            --test-dir "$PWD/build/package/${{ steps.preset.outputs.name }}/standalone-triangle" \
            --output-on-failure
          cmake -S tests/packaging/consumer -B "build/consumer/${{ steps.preset.outputs.name }}" \
            -G Ninja -DCMAKE_PREFIX_PATH="$prefix" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build "build/consumer/${{ steps.preset.outputs.name }}"
          ctest --test-dir "build/consumer/${{ steps.preset.outputs.name }}" --output-on-failure
      - name: 使用已发布 Runtime Bundle 运行 Consumer
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/granit-vulkan-runtime"
          mkdir -p "$runtime_dir"
          if ! command -v curl >/dev/null || ! command -v zstd >/dev/null; then
            apt-get update -qq
            apt-get install -y -qq curl zstd
          fi
          curl -fsSL \
            https://github.com/synchronized/granit/releases/download/v0.47.0/granit-vulkan-runtime-linux-x64.tar.zst \
            -o "$RUNNER_TEMP/granit-vulkan-runtime-linux-x64.tar.zst"
          zstd -q -d "$RUNNER_TEMP/granit-vulkan-runtime-linux-x64.tar.zst" \
            -o "$RUNNER_TEMP/granit-vulkan-runtime-linux-x64.tar"
          tar -xf "$RUNNER_TEMP/granit-vulkan-runtime-linux-x64.tar" -C "$runtime_dir"
          cmake \
            -DGRANIT_CONSUMER_BINARY_DIR="$PWD/build/consumer/${{ steps.preset.outputs.name }}" \
            -DGRANIT_INSTALL_PREFIX="$PWD/build/install/${{ steps.preset.outputs.name }}" \
            -DGRANIT_RUNTIME_ROOT="$runtime_dir" \
            -DGRANIT_RUNTIME_LOADER="$runtime_dir/lib/libvulkan.so.1" \
            -P tests/packaging/run_vulkan_runtime_consumer.cmake
      - name: 输出编译缓存统计
        if: always()
        shell: bash
        run: ccache --show-stats

  integration-runtime:
    runs-on: ubuntu-24.04
    container:
      image: >-
        ghcr.io/synchronized/granit-ci@sha256:6a2d0aba3b2464838958a4259d3a343106205eb35df9f4ad24d060bf98739015
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        linkage: [shared, static]
    steps:
      - uses: actions/checkout@v5
      - name: 恢复 Integration 编译缓存
        uses: actions/cache@v5
        with:
          path: .cache/ccache
          key: >-
            linux-ccache-v2-integration-clang-${{ matrix.linkage }}-${{ github.sha }}
          restore-keys: |
            linux-ccache-v2-integration-clang-${{ matrix.linkage }}-
      - name: 恢复 Integration 第三方依赖缓存
        uses: actions/cache@v5
        with:
          path: .cache/fetchcontent
          key: >-
            linux-fetchcontent-v2-clang-${{ matrix.linkage }}-${{ hashFiles('CMakeLists.txt') }}
      - name: 选择 preset
        id: preset
        shell: bash
        run: |
          suffix=""
          if [[ "${{ matrix.linkage }}" == "static" ]]; then suffix="-static"; fi
          echo "name=linux-clang${suffix}-release" >> "$GITHUB_OUTPUT"
      - name: 配置并构建 SDL3 与 ImGui Integration
        shell: bash
        run: |
          ccache --zero-stats
          cmake --preset "${{ steps.preset.outputs.name }}" \
            -DGRANIT_BUILD_INTEGRATION_SDL3=ON \
            -DGRANIT_BUILD_INTEGRATION_IMGUI=ON \
            -DGRANIT_DEPENDENCY_POLICY=auto \
            -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.cache/fetchcontent" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset "${{ steps.preset.outputs.name }}"
      - name: 运行 Vulkan Bindless 压力与时间戳基线
        shell: bash
        run: |
          GRANIT_VULKAN_VALIDATION=on \
            "build/${{ steps.preset.outputs.name }}/bin/granit_vulkan_backend_test" \
            "[bindless]" --reporter compact
      - name: 运行 ImGui 转换与视觉测试
        shell: bash
        run: |
          ctest --test-dir "build/${{ steps.preset.outputs.name }}" \
            --output-on-failure -R '^granit\.integration\.imgui(\.visual)?$'
      - name: 运行 X11 SDL3 Surface 与 ImGui 集成测试
        shell: bash
        run: |
          xvfb-run -a env SDL_VIDEODRIVER=x11 \
            "build/${{ steps.preset.outputs.name }}/bin/granit_integration_sdl3_surface_test" \
            --smoke-test
          xvfb-run -a env SDL_VIDEODRIVER=x11 \
            "build/${{ steps.preset.outputs.name }}/bin/granit_tutorial_08_sdl_imgui" --smoke-test
          xvfb-run -a env SDL_VIDEODRIVER=x11 \
            "build/${{ steps.preset.outputs.name }}/bin/granit_sample_model_viewer" \
            --asset "$PWD/tests/web/assets/model_viewer_fixture.gltf" \
            --backend=vulkan --validation --smoke-test --present-mode=fifo
      - name: 运行 Wayland SDL3 Surface 与 ImGui 集成测试
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/granit-integration-wayland"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=granit-integration-wayland
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            >"$RUNNER_TEMP/granit-integration-weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break
            sleep 0.1
          done
          [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] || {
            cat "$RUNNER_TEMP/granit-integration-weston.log"
            exit 1
          }
          SDL_VIDEODRIVER=wayland \
            "build/${{ steps.preset.outputs.name }}/bin/granit_integration_sdl3_surface_test" \
            --smoke-test
          SDL_VIDEODRIVER=wayland \
            "build/${{ steps.preset.outputs.name }}/bin/granit_tutorial_08_sdl_imgui" --smoke-test
          SDL_VIDEODRIVER=wayland \
            "build/${{ steps.preset.outputs.name }}/bin/granit_sample_model_viewer" \
            --asset "$PWD/tests/web/assets/model_viewer_fixture.gltf" \
            --backend=vulkan --validation --smoke-test --present-mode=fifo
      - name: 输出编译缓存统计
        if: always()
        shell: bash
        run: ccache --show-stats
