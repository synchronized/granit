name: Dawn Dependency Packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/dawn-dependencies.yml

permissions:
  contents: read

env:
  DAWN_REVISION: 0bc38adde72b79013536f8ce354b639ae19ae195
  DAWN_VERSION: v20260720.160313
  SCCACHE_GHA_ENABLED: "true"

jobs:
  windows-shared:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: 启用编译缓存
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: 获取锁定的 Dawn 源码
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout `
            https://dawn.googlesource.com/dawn "$env:RUNNER_TEMP/dawn"
          git -C "$env:RUNNER_TEMP/dawn" fetch --depth=1 origin $env:DAWN_REVISION
          git -C "$env:RUNNER_TEMP/dawn" checkout --detach FETCH_HEAD
      - name: 恢复 Dawn 第三方依赖
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/dawn/third_party
          key: dawn-third-party-windows-${{ env.DAWN_REVISION }}
      - name: 获取 Dawn 第三方源码
        shell: pwsh
        working-directory: ${{ runner.temp }}/dawn
        run: python tools/fetch_dawn_dependencies.py
      - name: 配置并构建 Dawn 共享库
        shell: pwsh
        run: |
          $source = "$env:RUNNER_TEMP/dawn"
          $build = "$env:RUNNER_TEMP/dawn-build"
          $stage = "$PWD/stage/granit-dawn-$env:DAWN_VERSION-windows-x64"
          cmake -S $source -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=$stage `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DBUILD_SHARED_LIBS=OFF `
            -DDAWN_BUILD_MONOLITHIC_LIBRARY=SHARED `
            -DDAWN_ENABLE_INSTALL=ON `
            -DDAWN_FETCH_DEPENDENCIES=OFF `
            -DDAWN_BUILD_SAMPLES=OFF `
            -DDAWN_BUILD_TESTS=OFF `
            -DDAWN_BUILD_NODE_BINDINGS=OFF `
            -DDAWN_ENABLE_D3D11=OFF `
            -DDAWN_ENABLE_D3D12=ON `
            -DDAWN_ENABLE_VULKAN=ON `
            -DDAWN_ENABLE_DESKTOP_GL=OFF `
            -DDAWN_ENABLE_OPENGLES=OFF `
            -DDAWN_ENABLE_NULL=OFF `
            -DTINT_BUILD_CMD_TOOLS=OFF `
            -DTINT_BUILD_TESTS=OFF
          cmake --build $build --target webgpu_dawn
          cmake --install $build
      - name: 验证并打包 Windows 产物
        id: package
        shell: pwsh
        run: |
          $name = "granit-dawn-$env:DAWN_VERSION-windows-x64"
          $stage = "$PWD/stage/$name"
          $dll = Get-ChildItem -LiteralPath $stage -Recurse -File -Filter 'webgpu_dawn.dll'
          if ($dll.Count -ne 1) { throw "预期恰好一个 webgpu_dawn.dll" }
          $exports = dumpbin /exports $dll.FullName
          if (-not ($exports | Select-String 'wgpuCreateInstance')) {
            throw "webgpu_dawn.dll 缺少 wgpuCreateInstance 导出"
          }
          Compress-Archive -Path $stage -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -Encoding ascii "$name.zip.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.zip
            ${{ steps.package.outputs.name }}.zip.sha256
          if-no-files-found: error

  linux-shared:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: 安装 Dawn 构建依赖
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake git libfuse2 libvulkan-dev libx11-xcb-dev libxcursor-dev \
            libxinerama-dev libxrandr-dev mesa-common-dev ninja-build pkg-config python3
      - name: 启用编译缓存
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: 获取锁定的 Dawn 源码
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout \
            https://dawn.googlesource.com/dawn "$RUNNER_TEMP/dawn"
          git -C "$RUNNER_TEMP/dawn" fetch --depth=1 origin "$DAWN_REVISION"
          git -C "$RUNNER_TEMP/dawn" checkout --detach FETCH_HEAD
      - name: 恢复 Dawn 第三方依赖
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/dawn/third_party
          key: dawn-third-party-linux-${{ env.DAWN_REVISION }}
      - name: 获取 Dawn 第三方源码
        shell: bash
        working-directory: ${{ runner.temp }}/dawn
        run: python3 tools/fetch_dawn_dependencies.py
      - name: 配置并构建 Dawn 共享库
        shell: bash
        run: |
          stage="$PWD/stage/granit-dawn-$DAWN_VERSION-linux-x64"
          CC=clang CXX=clang++ cmake -S "$RUNNER_TEMP/dawn" -B "$RUNNER_TEMP/dawn-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$stage" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBUILD_SHARED_LIBS=OFF \
            -DDAWN_BUILD_MONOLITHIC_LIBRARY=SHARED \
            -DDAWN_ENABLE_INSTALL=ON \
            -DDAWN_FETCH_DEPENDENCIES=OFF \
            -DDAWN_BUILD_SAMPLES=OFF \
            -DDAWN_BUILD_TESTS=OFF \
            -DDAWN_BUILD_NODE_BINDINGS=OFF \
            -DDAWN_ENABLE_D3D11=OFF \
            -DDAWN_ENABLE_D3D12=OFF \
            -DDAWN_ENABLE_VULKAN=ON \
            -DDAWN_ENABLE_DESKTOP_GL=OFF \
            -DDAWN_ENABLE_OPENGLES=OFF \
            -DDAWN_ENABLE_NULL=OFF \
            -DTINT_BUILD_CMD_TOOLS=OFF \
            -DTINT_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/dawn-build" --target webgpu_dawn
          cmake --install "$RUNNER_TEMP/dawn-build"
      - name: 验证并打包 Linux 产物
        id: package
        shell: bash
        run: |
          name="granit-dawn-$DAWN_VERSION-linux-x64"
          stage="$PWD/stage/$name"
          mapfile -t libraries < <(find "$stage" -type f -name 'libwebgpu_dawn.so*')
          [[ "${#libraries[@]}" -eq 1 ]]
          nm -D --defined-only "${libraries[0]}" | grep -q 'wgpuCreateInstance'
          tar -czf "$name.tar.gz" -C stage "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          if-no-files-found: error
