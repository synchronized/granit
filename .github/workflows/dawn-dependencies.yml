name: Dawn SDK Build

on:
  workflow_dispatch:
    inputs:
      publish_sdk:
        description: "验证通过后发布长期保存的版本化 Dawn SDK"
        required: true
        default: false
        type: boolean
      run_windows:
        description: "构建并验证 Windows SDK"
        required: true
        default: true
        type: boolean
      run_linux:
        description: "构建并验证 Linux SDK"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  DAWN_REVISION: 0bc38adde72b79013536f8ce354b639ae19ae195
  DAWN_VERSION: v20260720.160313
  SCCACHE_GHA_ENABLED: "true"

jobs:
  windows-static-plugin:
    if: ${{ inputs.run_windows }}
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: 启用编译缓存
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: 获取锁定的 Dawn 源码
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout `
            https://dawn.googlesource.com/dawn "$env:RUNNER_TEMP/dawn"
          git -C "$env:RUNNER_TEMP/dawn" fetch --depth=1 origin $env:DAWN_REVISION
          git -C "$env:RUNNER_TEMP/dawn" checkout --detach FETCH_HEAD
      - name: 恢复 Dawn 第三方依赖
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/dawn/third_party
          key: dawn-third-party-windows-${{ env.DAWN_REVISION }}
      - name: 获取 Dawn 第三方源码
        shell: pwsh
        working-directory: ${{ runner.temp }}/dawn
        run: python tools/fetch_dawn_dependencies.py
      - name: 配置并构建 Dawn 静态库
        shell: pwsh
        run: |
          $source = "$env:RUNNER_TEMP/dawn"
          $build = "$env:RUNNER_TEMP/dawn-build"
          $stage = "$PWD/stage/granit-dawn-static-$env:DAWN_VERSION-windows-x64"
          cmake -S $source -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DBUILD_SHARED_LIBS=OFF `
            -DDAWN_BUILD_MONOLITHIC_LIBRARY=STATIC `
            -DDAWN_ENABLE_INSTALL=ON `
            -DDAWN_FETCH_DEPENDENCIES=OFF `
            -DDAWN_BUILD_SAMPLES=OFF `
            -DDAWN_BUILD_TESTS=OFF `
            -DDAWN_BUILD_NODE_BINDINGS=OFF `
            -DDAWN_ENABLE_D3D11=OFF `
            -DDAWN_ENABLE_D3D12=ON `
            -DDAWN_ENABLE_VULKAN=ON `
            -DDAWN_ENABLE_DESKTOP_GL=OFF `
            -DDAWN_ENABLE_OPENGLES=OFF `
            -DDAWN_ENABLE_NULL=OFF `
            -DDAWN_USE_GLFW=OFF `
            -DDAWN_USE_WINDOWS_UI=ON `
            -DTINT_BUILD_CMD_TOOLS=ON `
            -DTINT_BUILD_TESTS=OFF
          cmake --build $build --target webgpu_dawn tint_cmd_tint_cmd
          cmake --install $build --prefix $stage
          $tint = Get-ChildItem -LiteralPath $build -Recurse -File -Filter 'tint.exe'
          if ($tint.Count -ne 1) { throw "预期恰好一个 tint.exe" }
          New-Item -ItemType Directory -Force -Path "$stage/bin" | Out-Null
          Copy-Item -LiteralPath $tint.FullName -Destination "$stage/bin/tint.exe"
      - name: 验证 Windows 静态产物
        shell: pwsh
        run: |
          $stage = "$PWD/stage/granit-dawn-static-$env:DAWN_VERSION-windows-x64"
          $library = Get-ChildItem -LiteralPath $stage -Recurse -File -Filter 'webgpu_dawn.lib'
          if ($library.Count -ne 1) { throw "预期恰好一个 webgpu_dawn.lib" }
          $symbols = dumpbin /symbols $library.FullName
          if (-not ($symbols | Select-String 'wgpuCreateInstance')) {
            throw "webgpu_dawn.lib 缺少 wgpuCreateInstance"
          }
          $tint = "$stage/bin/tint.exe"
          $fixture = "$PWD/tests/fixtures/shaders/s10c_triangle.wgsl"
          $vertex = "$env:RUNNER_TEMP/s10c_triangle.vert.spv"
          $fragment = "$env:RUNNER_TEMP/s10c_triangle.frag.spv"
          & $tint --format spirv --entry-point vs_main --output-name $vertex --validate $fixture
          if ($LASTEXITCODE -ne 0) { throw "Tint 编译 Vertex WGSL 失败" }
          & $tint --format spirv --entry-point fs_main --output-name $fragment --validate $fixture
          if ($LASTEXITCODE -ne 0) { throw "Tint 编译 Fragment WGSL 失败" }
          foreach ($output in @($vertex, $fragment)) {
            $bytes = [System.IO.File]::ReadAllBytes($output)
            if ($bytes.Length -lt 20 -or [BitConverter]::ToUInt32($bytes, 0) -ne 0x07230203) {
              throw "Tint 未生成有效 SPIR-V：$output"
            }
          }
      - name: 构建并运行 Windows WebGPU 插件 smoke test
        shell: pwsh
        run: |
          $stage = "$PWD/stage/granit-dawn-static-$env:DAWN_VERSION-windows-x64"
          $build = "$env:RUNNER_TEMP/granit-webgpu-build"
          $vertexAsset = "$env:RUNNER_TEMP/s10c_tool_triangle.vert.granit-shader"
          $fragmentAsset = "$env:RUNNER_TEMP/s10c_tool_triangle.frag.granit-shader"
          cmake -S . -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DGRANIT_BUILD_BACKEND_WEBGPU=ON `
            -DGRANIT_WEBGPU_FORCE_FALLBACK_ADAPTER=ON `
            "-DGRANIT_DAWN_ROOT=$stage" `
            "-DGRANIT_S10C_VERTEX_SHADER_ASSET=$vertexAsset" `
            "-DGRANIT_S10C_FRAGMENT_SHADER_ASSET=$fragmentAsset" `
            -DGRANIT_BUILD_EXAMPLES=OFF `
            -DGRANIT_BUILD_TOOLS=ON `
            -DGRANIT_BUILD_TESTING=ON
          cmake --build $build --target granit_webgpu_plugin_smoke `
            granit_shader_asset_vulkan_smoke granit_renderer_test granit_shader_tool
          $shaderTool = "$build/bin/granit_shader_tool.exe"
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          $firstOutput = (& $shaderTool compile --tint "$stage/bin/tint.exe" `
            --input "$PWD/tests/fixtures/shaders/s10c_triangle.wgsl" --entry vs_main `
            --stage vertex --output "$env:RUNNER_TEMP/s10c_tool_triangle.vert.spv" `
            --asset $vertexAsset --tint-revision "$env:DAWN_REVISION" 2>&1 | Out-String)
          $firstCode = $LASTEXITCODE
          $watch.Stop()
          $firstMilliseconds = $watch.ElapsedMilliseconds
          Write-Host $firstOutput
          if ($firstCode -ne 0) { throw "granit_shader_tool 调用 Tint 失败" }
          $watch.Restart()
          $cacheOutput = (& $shaderTool compile --tint "$stage/bin/tint.exe" `
            --input "$PWD/tests/fixtures/shaders/s10c_triangle.wgsl" --entry vs_main `
            --stage vertex --output "$env:RUNNER_TEMP/s10c_tool_triangle.vert.spv" `
            --asset $vertexAsset --tint-revision "$env:DAWN_REVISION" 2>&1 | Out-String)
          $cacheCode = $LASTEXITCODE
          $watch.Stop()
          $cacheMilliseconds = $watch.ElapsedMilliseconds
          Write-Host $cacheOutput
          if ($cacheCode -ne 0 -or $cacheOutput -notmatch "缓存命中") {
            throw "Shader 资产重复构建未报告缓存命中"
          }
          & $shaderTool compile --tint "$stage/bin/tint.exe" `
            --input "$PWD/tests/fixtures/shaders/s10c_triangle.wgsl" --entry fs_main `
            --stage fragment --output "$env:RUNNER_TEMP/s10c_tool_triangle.frag.spv" `
            --asset $fragmentAsset --tint-revision "$env:DAWN_REVISION"
          if ($LASTEXITCODE -ne 0) { throw "granit_shader_tool 调用 Tint 失败" }
          $invalidOutput = "$env:RUNNER_TEMP/s10c_invalid.spv"
          $invalidDiagnostic = (& $shaderTool compile --tint "$stage/bin/tint.exe" `
            --input "$PWD/tests/fixtures/shaders/s10c_invalid.wgsl" --entry vs_main `
            --stage vertex --output $invalidOutput 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 1 -or `
              $invalidDiagnostic -notmatch 's10c_invalid\.wgsl:\d+:\d+' -or `
              $invalidDiagnostic -notmatch '入口点：vs_main' -or `
              $invalidDiagnostic -notmatch '阶段：vertex' -or `
              (Test-Path -LiteralPath $invalidOutput)) {
            throw "真实 Tint 诊断缺少文件、行列、入口点或阶段：$invalidDiagnostic"
          }
          Write-Host $invalidDiagnostic
          $vertexBytes = (Get-Item -LiteralPath $vertexAsset).Length
          $fragmentBytes = (Get-Item -LiteralPath $fragmentAsset).Length
          Write-Host "Shader 指标：首次=${firstMilliseconds}ms，缓存=${cacheMilliseconds}ms，" `
            "vertex=${vertexBytes}bytes，fragment=${fragmentBytes}bytes"
          @"
          ### Windows Shader 资产

          | 指标 | 结果 |
          |---|---:|
          | 首次构建 | $firstMilliseconds ms |
          | 缓存命中构建 | $cacheMilliseconds ms |
          | Vertex 资产 | $vertexBytes bytes |
          | Fragment 资产 | $fragmentBytes bytes |
          "@ | Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $fxc = "$env:WINDIR/System32/d3dcompiler_47.dll"
          if (-not (Test-Path -LiteralPath $fxc -PathType Leaf)) {
            throw "Windows runner 缺少 d3dcompiler_47.dll"
          }
          Copy-Item -LiteralPath $fxc -Destination "$build/bin/d3dcompiler_47.dll"
          ctest --test-dir $build -R granit.backend.webgpu_plugin_smoke --verbose --output-on-failure
          & "$build/bin/granit_renderer_test.exe" "[pipeline][bind-group][smoke]"
          if ($LASTEXITCODE -ne 0) { throw "Windows 跨后端 Renderer Fixture 失败" }
      - name: 打包 Windows 产物
        id: package
        shell: pwsh
        run: |
          $name = "granit-dawn-static-$env:DAWN_VERSION-windows-x64"
          $stage = "$PWD/stage/$name"
          Compress-Archive -Path $stage -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -Encoding ascii "$name.zip.sha256"
          "name=$name" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.zip
            ${{ steps.package.outputs.name }}.zip.sha256
          if-no-files-found: error

  linux-static-plugin:
    if: ${{ inputs.run_linux }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: 安装 Dawn 构建依赖
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake git libfuse2 libvulkan-dev libx11-xcb-dev libxcursor-dev \
            libwayland-dev libxinerama-dev libxrandr-dev mesa-common-dev mesa-vulkan-drivers \
            ninja-build pkg-config python3 vulkan-validationlayers wayland-protocols
      - name: 启用编译缓存
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: 获取锁定的 Dawn 源码
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout \
            https://dawn.googlesource.com/dawn "$RUNNER_TEMP/dawn"
          git -C "$RUNNER_TEMP/dawn" fetch --depth=1 origin "$DAWN_REVISION"
          git -C "$RUNNER_TEMP/dawn" checkout --detach FETCH_HEAD
      - name: 恢复 Dawn 第三方依赖
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/dawn/third_party
          key: dawn-third-party-linux-${{ env.DAWN_REVISION }}
      - name: 获取 Dawn 第三方源码
        shell: bash
        working-directory: ${{ runner.temp }}/dawn
        run: python3 tools/fetch_dawn_dependencies.py
      - name: 配置并构建 Dawn 静态库
        shell: bash
        run: |
          stage="$PWD/stage/granit-dawn-static-$DAWN_VERSION-linux-x64"
          CC=clang CXX=clang++ cmake -S "$RUNNER_TEMP/dawn" -B "$RUNNER_TEMP/dawn-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBUILD_SHARED_LIBS=OFF \
            -DDAWN_BUILD_MONOLITHIC_LIBRARY=STATIC \
            -DDAWN_ENABLE_INSTALL=ON \
            -DDAWN_FETCH_DEPENDENCIES=OFF \
            -DDAWN_BUILD_SAMPLES=OFF \
            -DDAWN_BUILD_TESTS=OFF \
            -DDAWN_BUILD_NODE_BINDINGS=OFF \
            -DDAWN_ENABLE_D3D11=OFF \
            -DDAWN_ENABLE_D3D12=OFF \
            -DDAWN_ENABLE_VULKAN=ON \
            -DDAWN_ENABLE_DESKTOP_GL=OFF \
            -DDAWN_ENABLE_OPENGLES=OFF \
            -DDAWN_ENABLE_NULL=OFF \
            -DDAWN_USE_GLFW=OFF \
            -DDAWN_USE_WAYLAND=ON \
            -DDAWN_USE_X11=ON \
            -DTINT_BUILD_CMD_TOOLS=ON \
            -DTINT_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/dawn-build" --target webgpu_dawn tint_cmd_tint_cmd
          cmake --install "$RUNNER_TEMP/dawn-build" --prefix "$stage"
          mapfile -t tint_tools < <(find "$RUNNER_TEMP/dawn-build" -type f -name tint -perm -u+x)
          [[ "${#tint_tools[@]}" -eq 1 ]]
          install -Dm755 "${tint_tools[0]}" "$stage/bin/tint"
      - name: 验证 Linux 静态产物
        shell: bash
        run: |
          stage="$PWD/stage/granit-dawn-static-$DAWN_VERSION-linux-x64"
          mapfile -t libraries < <(find "$stage" -type f -name 'libwebgpu_dawn.a')
          [[ "${#libraries[@]}" -eq 1 ]]
          nm --defined-only "${libraries[0]}" | grep -q 'wgpuCreateInstance'
          tint="$stage/bin/tint"
          fixture="$PWD/tests/fixtures/shaders/s10c_triangle.wgsl"
          vertex="$RUNNER_TEMP/s10c_triangle.vert.spv"
          fragment="$RUNNER_TEMP/s10c_triangle.frag.spv"
          "$tint" --format spirv --entry-point vs_main --output-name "$vertex" \
            --validate "$fixture"
          "$tint" --format spirv --entry-point fs_main --output-name "$fragment" \
            --validate "$fixture"
          for output in "$vertex" "$fragment"; do
            [[ "$(od -An -tx4 -N4 "$output" | tr -d ' ')" == "07230203" ]]
          done
      - name: 构建并运行 Linux WebGPU 插件 smoke test
        shell: bash
        run: |
          stage="$PWD/stage/granit-dawn-static-$DAWN_VERSION-linux-x64"
          build="$RUNNER_TEMP/granit-webgpu-build"
          vertex_asset="$RUNNER_TEMP/s10c_tool_triangle.vert.granit-shader"
          fragment_asset="$RUNNER_TEMP/s10c_tool_triangle.frag.granit-shader"
          CC=clang CXX=clang++ cmake -S . -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGRANIT_BUILD_BACKEND_WEBGPU=ON \
            -DGRANIT_WEBGPU_FORCE_FALLBACK_ADAPTER=ON \
            -DGRANIT_DAWN_ROOT="$stage" \
            -DGRANIT_S10C_VERTEX_SHADER_ASSET="$vertex_asset" \
            -DGRANIT_S10C_FRAGMENT_SHADER_ASSET="$fragment_asset" \
            -DGRANIT_BUILD_EXAMPLES=OFF \
            -DGRANIT_BUILD_TOOLS=ON \
            -DGRANIT_BUILD_TESTING=ON \
            -DGRANIT_ENABLE_XCB=OFF \
            -DGRANIT_ENABLE_WAYLAND=OFF
          cmake --build "$build" --target granit_webgpu_plugin_smoke \
            granit_shader_asset_vulkan_smoke granit_renderer_test granit_shader_tool
          shader_tool="$build/bin/granit_shader_tool"
          first_start="$(date +%s%N)"
          first_output="$("$shader_tool" compile --tint "$stage/bin/tint" \
            --input "$PWD/tests/fixtures/shaders/s10c_triangle.wgsl" --entry vs_main \
            --stage vertex --output "$RUNNER_TEMP/s10c_tool_triangle.vert.spv" \
            --asset "$vertex_asset" --tint-revision "$DAWN_REVISION" 2>&1)"
          first_ms=$(( ($(date +%s%N) - first_start) / 1000000 ))
          printf '%s\n' "$first_output"
          cache_start="$(date +%s%N)"
          cache_output="$("$shader_tool" compile --tint "$stage/bin/tint" \
            --input "$PWD/tests/fixtures/shaders/s10c_triangle.wgsl" --entry vs_main \
            --stage vertex --output "$RUNNER_TEMP/s10c_tool_triangle.vert.spv" \
            --asset "$vertex_asset" --tint-revision "$DAWN_REVISION" 2>&1)"
          cache_ms=$(( ($(date +%s%N) - cache_start) / 1000000 ))
          printf '%s\n' "$cache_output"
          grep -Fq '缓存命中' <<< "$cache_output"
          "$shader_tool" compile --tint "$stage/bin/tint" \
            --input "$PWD/tests/fixtures/shaders/s10c_triangle.wgsl" --entry fs_main \
            --stage fragment --output "$RUNNER_TEMP/s10c_tool_triangle.frag.spv" \
            --asset "$fragment_asset" --tint-revision "$DAWN_REVISION"
          invalid_output="$RUNNER_TEMP/s10c_invalid.spv"
          if invalid_diagnostic="$("$shader_tool" compile --tint "$stage/bin/tint" \
            --input "$PWD/tests/fixtures/shaders/s10c_invalid.wgsl" --entry vs_main \
            --stage vertex --output "$invalid_output" 2>&1)"; then
            echo '无效 WGSL 意外编译成功' >&2
            exit 1
          fi
          grep -Eq 's10c_invalid\.wgsl:[0-9]+:[0-9]+' <<< "$invalid_diagnostic"
          grep -Fq '入口点：vs_main' <<< "$invalid_diagnostic"
          grep -Fq '阶段：vertex' <<< "$invalid_diagnostic"
          [[ ! -e "$invalid_output" ]]
          printf '%s\n' "$invalid_diagnostic"
          vertex_bytes="$(stat -c '%s' "$vertex_asset")"
          fragment_bytes="$(stat -c '%s' "$fragment_asset")"
          printf 'Shader 指标：首次=%sms，缓存=%sms，vertex=%sbytes，fragment=%sbytes\n' \
            "$first_ms" "$cache_ms" "$vertex_bytes" "$fragment_bytes"
          {
            echo '### Linux Shader 资产'
            echo
            echo '| 指标 | 结果 |'
            echo '|---|---:|'
            echo "| 首次构建 | $first_ms ms |"
            echo "| 缓存命中构建 | $cache_ms ms |"
            echo "| Vertex 资产 | $vertex_bytes bytes |"
            echo "| Fragment 资产 | $fragment_bytes bytes |"
          } >> "$GITHUB_STEP_SUMMARY"
          lvp_icd="$(find /usr/share/vulkan/icd.d -type f -name 'lvp_icd*.json' -print -quit)"
          [[ -n "$lvp_icd" ]]
          VK_DRIVER_FILES="$lvp_icd" LIBGL_ALWAYS_SOFTWARE=1 \
            ctest --test-dir "$build" \
              -R 'granit\.backend\.(webgpu_plugin|shader_asset_vulkan)_smoke' \
              --verbose --output-on-failure
          VK_DRIVER_FILES="$lvp_icd" LIBGL_ALWAYS_SOFTWARE=1 \
            "$build/bin/granit_renderer_test" '[pipeline][bind-group][smoke]'
      - name: 打包 Linux 产物
        id: package
        shell: bash
        run: |
          name="granit-dawn-static-$DAWN_VERSION-linux-x64"
          stage="$PWD/stage/$name"
          tar -czf "$name.tar.gz" -C stage "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

  publish-sdk:
    if: ${{ inputs.publish_sdk && inputs.run_windows && inputs.run_linux }}
    needs:
      - windows-static-plugin
      - linux-static-plugin
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: 下载已验证的 SDK 包
        uses: actions/download-artifact@v6
        with:
          pattern: granit-dawn-static-*
          path: packages
          merge-multiple: true
      - name: 发布版本化 Dawn SDK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision_short="${DAWN_REVISION:0:12}"
          tag="dawn-sdk-${DAWN_VERSION}-${revision_short}"
          title="Granit Dawn SDK ${DAWN_VERSION} (${revision_short})"
          mapfile -t packages < <(find packages -maxdepth 1 -type f | sort)
          [[ "${#packages[@]}" -eq 4 ]]
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --prerelease \
              --notes "由锁定 Dawn 修订 ${DAWN_REVISION} 构建并通过 Granit WebGPU 插件 smoke test。"
          fi
          gh release upload "$tag" "${packages[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
