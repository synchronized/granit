name: Documentation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出源码
        uses: actions/checkout@v5
      - name: 检查文档
        run: cmake -DGRANIT_SOURCE_DIR="$PWD" -P cmake/check_documentation.cmake
