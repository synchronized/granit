name: 配置 MSVC 开发环境
description: 使用 GitHub Windows Runner 自带的 VsDevCmd.bat 配置 MSVC

inputs:
  arch:
    description: 目标架构
    required: false
    default: x64
  toolset:
    description: 指定 MSVC 工具集系列（例如 14.38）；为空时使用默认版本
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: 导出 MSVC 环境变量
      shell: pwsh
      env:
        GRANIT_MSVC_ARCH: ${{ inputs.arch }}
        GRANIT_MSVC_TOOLSET: ${{ inputs.toolset }}
      run: |
        $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
        if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
          throw "未找到 Visual Studio Installer 的 vswhere.exe"
        }
        $installation = & $vswhere -latest -products * `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          -property installationPath
        if (-not $installation) { throw "未找到包含 MSVC 工具链的 Visual Studio" }
        $devCmd = Join-Path $installation.Trim() "Common7/Tools/VsDevCmd.bat"
        if (-not (Test-Path -LiteralPath $devCmd -PathType Leaf)) {
          throw "未找到 VsDevCmd.bat：$devCmd"
        }
        $toolset = $env:GRANIT_MSVC_TOOLSET
        if ($toolset -and $toolset -notmatch '^14\.[0-9]{2}$') {
          throw '工具集系列必须使用 14.xx 格式'
        }
        $versionArg = if ($toolset) { " -vcvars_ver=$toolset" } else { '' }
        $command = "`"$devCmd`" -no_logo -arch=$env:GRANIT_MSVC_ARCH$versionArg >nul && set"
        $variables = & $env:COMSPEC /d /s /c $command
        if ($LASTEXITCODE -ne 0) { throw "VsDevCmd.bat 执行失败" }
        foreach ($line in $variables) {
          if ($line -notmatch '^([^=]+)=(.*)$') { continue }
          $name = $Matches[1]
          $value = $Matches[2]
          $allowed = $name -match `
            '^(PATH|INCLUDE|LIB|LIBPATH|VC.*|VS.*|WindowsSdk.*|UniversalCRTSdkDir|' + `
            'UCRTVersion|ExtensionSdkDir|Framework.*|NETFXSDKDir)$'
          if (-not $allowed) { continue }
          "$name=$value" | Add-Content -Encoding utf8 $env:GITHUB_ENV
        }
