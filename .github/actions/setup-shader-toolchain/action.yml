name: Setup Granit Shader Toolchain
description: 恢复、下载并校验锁定的 DXC/Tint 工具链，返回无需版本目录知识的根路径。

inputs:
  destination:
    description: 工具链缓存目录
    required: false
    default: build/toolchains

outputs:
  root:
    description: 已校验 Shader 工具链的绝对根目录
    value: ${{ steps.setup.outputs.root }}

runs:
  using: composite
  steps:
    - name: 恢复锁定 Shader 工具链缓存
      uses: actions/cache@v5
      with:
        path: ${{ inputs.destination }}
        key: >-
          shader-toolchain-${{ runner.os }}-
          ${{ hashFiles('cmake/toolchain/download_shader_toolchain.cmake',
          'cmake/toolchain/GranitShaderToolchain.cmake',
          'cmake/toolchain/GranitShaderToolchainLock.cmake',
          'cmake/toolchain/verify_shader_toolchain_manifest.cmake') }}
    - name: 下载并校验锁定 Shader 工具链
      id: setup
      shell: bash
      env:
        GRANIT_SHADER_TOOLCHAIN_DESTINATION: ${{ inputs.destination }}
      run: |
        set -euo pipefail
        result_file="$RUNNER_TEMP/granit-shader-toolchain-root.txt"
        cmake \
          -DDESTINATION="$GRANIT_SHADER_TOOLCHAIN_DESTINATION" \
          -DRESULT_FILE="$result_file" \
          -P cmake/toolchain/download_shader_toolchain.cmake
        root="$(cmake -E cat "$result_file")"
        test -n "$root"
        echo "root=$root" >> "$GITHUB_OUTPUT"
